<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="fig.css">
<style>
 #fig { padding: 12px 10px; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 10px; row-gap: 16px; }
 .ph { display: flex; flex-direction: column; }
 .hd { height: 48px; display: flex; flex-direction: column; justify-content: center; padding: 0 26px 0 22px; font-size: 12px; line-height: 1.3;
       clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 14px 50%); }
 .ph:first-child .hd { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%); padding-left: 12px; }
 .hd b { font-size: 14px; }
 .bd { margin-top: 6px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px 8px 22px; font-size: 12.5px; line-height: 1.55; color: #1f2937; flex: 1; background: #fafafa; }
 .bd ul { margin: 0; padding: 0; } .bd li { margin: 0; }
 .dod { margin-top: 6px; font-size: 11.5px; color: #1f4e79; font-weight: 700; margin-left: -12px; }
</style></head><body>
<div id="fig"></div>
<script src="fig.js"></script>
<script>
 const ramp = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95'];
 const PH = [
  ['Phase 0', '기준선 측정 하네스', ['L0~L3 과제 (직접 + SWE-bench)', '자동 채점기 · 누출 테스트', 'Opus 기준선 리포트', '단계별 실효 비용 측정'], 'KPI 목표 · 사다리 순서 확정'],
  ['Phase 1', '뼈대 · Claude Code 연동', ['CLI · 데몬 · 로컬 인증', '중계 훅 · 범위 검사 훅', '1차 판정 · 최소 총괄 스킬', '세션 종료 검증 · 상태 라인'], 'L0·L1 실행 · 데몬 꺼도 정상'],
  ['Phase 2', '동적 팀 · 워크플로우', ['L0~L3 팀 프리셋', '총괄 스킬 · MCP 도구', '작업 원장 (node:sqlite)', 'worktree 병렬 · 2차 판정'], 'L2 · L3 과제 완주 + 지표 리포트'],
  ['Phase 3', '동적 티어 · API 프록시', ['티어 사다리 · 진동 방지 · HITL', 'API 키 프록시(관찰 전용) · Vault', '3차 판정 · 학습 루프', '라우팅 자동 해제 · 대시보드'], 'KPI 달성 여부 측정'],
  ['Phase 4', '데스크톱 앱', ['대시보드 설정 편집', 'Tauri 데스크톱 앱', 'Codex는 별도 저장소로'], '설치 파일로 설치 · 구동'],
  ['Phase 5', '팀 게이트웨이', ['다중 사용자 인증', '사용자별 키 · 예산', 'Qdrant 공유 학습', 'Docker 배포'], '사용자별 비용 분리 집계'],
 ];
 PH.forEach((p, i) => {
  const d = document.createElement('div'); d.className = 'ph';
  const dark = i >= 3;
  d.innerHTML = `<div class="hd" style="background:${ramp[i]};color:${dark ? '#fff' : '#0d2a4d'}"><b>${p[0]}</b>${p[1]}</div>` +
   `<div class="bd"><ul>${p[2].map(x => `<li>${x}</li>`).join('')}</ul><div class="dod">DoD: ${p[3]}</div></div>`;
  FIG.appendChild(d);
 });
 done();
</script></body></html>
