  prompt: |
    請改一下 confkit 的結構。現在 `loadConfig` 把各層合併一次、回傳一個普通物件就結束了，所以 (1) 不知道某個值來自哪一層，(2) 沒有地方接入 JSON 或命令列參數這種新輸入，(3) 值之間不能互相參照，(4) 執行期間不能重新讀取。我們打算把輸入抽象成 **來源**，並在其上加上 **出處追蹤 · 參照替換 · 用於查詢的 Config 物件 · 重新讀取**。`loadConfig` 保留為跑在新結構之上的一層薄封裝。模組請按職責拆分(各個來源、合併與出處、替換、比較、遮蔽、Config 物件)。

    下面的名字全部從 `src/index.ts` export。錯誤一律使用既有的 `ConfigError`。

    ## 1. 來源
    ```ts
    interface ConfigSource { name: string; load(): ConfigObject }

    objectSource(name: string, value: ConfigObject | (() => ConfigObject)): ConfigSource
    iniSource(name: string, text: string | (() => string)): ConfigSource      // 既有的 parseIni
    jsonSource(name: string, text: string | (() => string)): ConfigSource
    envSource(env: Record<string, string | undefined>, prefix = 'APP_', name = 'env'): ConfigSource   // 既有的 fromEnv
    argvSource(argv: string[], name = 'argv'): ConfigSource
    ```
    - 建立來源時什麼都不讀，每次呼叫 `load()` 時重新讀取。傳入函式時，每次 `load()` 都重新呼叫這個函式；`envSource` 每次都重新查看傳入的 env 物件。
    - `objectSource` 的 `load()` 回傳深拷貝(拿到的一方修改它，原物件也不變)。
    - `jsonSource`：只接受最上層是物件的 JSON。解析失敗或最上層不是物件(陣列、數字、null)時，在 `load()` 裡丟 `ConfigError`，訊息裡帶上來源的名字。JSON 裡的 `null` 值原樣保留。
    - `argvSource` 的規則：
      - `--db.host=localhost`：`=` 後面是值(`--name=` 是空字串，值裡面的 `=` 原樣保留)。
      - `--port 8080`：沒有 `=`，而且下一個 token 不以 `--` 開頭時，那個 token 就是值(`--offset -5` 是 -5)。
      - `--debug`：沒有值時是 `true`。
      - `--no-debug`：`false`。不把下一個 token 當成值取走。
      - 鍵裡的 `.` 表示巢狀。值按和 INI 值相同的規則轉換(`true`/`false`、數字、用引號包起來就是字串)。
      - 出現 `--` 之後的內容全部忽略。既不是選項也不是選項值的 token 忽略。

    ## 2. 合併與出處
    ```ts
    resolveSources(sources: ConfigSource[]): { value: ConfigObject; origins: Record<string, string> }
    ```
    - 按順序 `load()` 後合併。後面的來源勝出，物件之間按鍵合併，其他的值(包括陣列)整個取代(和既有的 `deepMerge` 規則相同)。
    - `origins` 是結果裡每個 **葉子**(不是物件的值。陣列和 null 也是葉子)路徑對應的、給出該值的來源名。路徑是 `'db.host'` 這樣的點號寫法。物件變成純量，或者純量變成物件時，舊路徑的出處必須消失。
    - 來源名重複時丟 `ConfigError`(訊息裡包含那個名字)。

    ## 3. 參照替換
    ```ts
    interpolate(config: ConfigObject): ConfigObject   // 回傳新物件，不改變輸入
    ```
    - 把字串值裡的 `${路徑}` 換成該路徑的值。陣列裡的字串也在範圍內。花括號裡首尾的空白忽略。
    - 整個字串只有一個參照時(`'${port}'`)，保持被參照值的型別(數字還是數字)。和其他字元混在一起時，當成字串串接。
    - 被參照的值裡還有參照時，一直展開到底。
    - `$${` 不做替換，變成字面上的 `${`。
    - 錯誤(`ConfigError`，`path` 是包含該參照的值的路徑)：
      - 路徑不存在：訊息裡包含 `unknown reference`
      - 循環(包括參照自己)：訊息裡包含 `circular reference`
      - 被參照的值不是字串、數字、布林值(物件、陣列、null)

    ## 4. 比較
    ```ts
    interface ConfigChange { path: string; before: ConfigValue | undefined; after: ConfigValue | undefined }
    diffConfig(before: ConfigObject, after: ConfigObject): ConfigChange[]
    ```
    以葉子為單位，把新增(`before: undefined`) · 刪除(`after: undefined`) · 變更按 path 由小到大回傳。陣列內容相同就算相同的值。葉子變成物件時，表現為舊葉子的刪除和新葉子的新增。

    ## 5. Config 物件
    ```ts
    createConfig(options: {
      sources: ConfigSource[];
      interpolate?: boolean;   // 預設 true
      secrets?: string[];      // 要遮蔽的路徑模式
    }): Config

    interface Config {
      get(path: string): ConfigValue | undefined;
      has(path: string): boolean;
      require(path: string): ConfigValue;
      getString(path: string, fallback?: string): string;
      getNumber(path: string, fallback?: number): number;
      getBoolean(path: string, fallback?: boolean): boolean;
      getDuration(path: string, fallback?: number): number;   // ms
      origin(path: string): string | undefined;
      explain(): Array<{ path: string; value: ConfigValue; source: string }>;
      toObject(options?: { redact?: boolean }): ConfigObject;
      reload(): ConfigChange[];
      onChange(listener: (changes: ConfigChange[]) => void): () => void;
    }
    ```
    - `createConfig` 會立刻讀取(來源有錯或替換有錯就在這裡 throw)。值是合併之後又做完替換的值，出處以合併時為準。
    - `require` 和按型別讀取時如果沒有值，丟 `ConfigError`(訊息裡包含 `missing required config`，並設定 `path`)。按型別讀取時如果給了 `fallback`，**只有在沒有值時** 才回傳它。
    - 型別不符時丟 `ConfigError`(設定 `path`，訊息裡包含下面的字樣)：
      - `getString`：只接受字串。`expected string`
      - `getNumber`：數字或數字字串(`'3'`)。`expected number`
      - `getBoolean`：布林值或 `'true'`/`'false'`。`expected boolean`
      - `getDuration`：數字(ms)或既有 `parseDuration` 能讀的字串。`expected duration`
    - `origin(path)`：葉子路徑的來源名。物件路徑或不存在的路徑回傳 `undefined`。
    - `explain()`：按 path 由小到大列出所有葉子。`toObject()`：深拷貝。
    - `secrets`：點號寫法的路徑模式，`*` 對應一個片段(`db.password`、`*.token`、`api.*`)。符合模式的路徑及其下層都是機密。`toObject({ redact: true })` 把機密的值換成 `'***'`(機密路徑是物件時，整個物件變成 `'***'`)，`explain()` 把機密葉子的 `value` 輸出為 `'***'`。`get` 等直接讀取回傳真正的值。
    - `reload()`：重新讀取所有來源並替換，回傳和之前的值做 `diffConfig` 的結果。只要有一處變更，就用這個陣列把已註冊的監聽器各呼叫一次。沒有變更就不呼叫。重新讀取時出錯就 throw，而且 **原樣保持之前的狀態**，也不呼叫監聽器。
    - `onChange` 回傳一個取消註冊的函式。

    ## 6. loadConfig
    - 既有行為維持不變(defaults < sources < env，不做替換)。既有的測試必須通過。
    - 在 `LoadOptions` 裡加上 `argv?: string[]`(優先順序最高)和 `interpolate?: boolean`(預設 false)。
    - 內部請用上面的來源和 `createConfig` 來寫。
