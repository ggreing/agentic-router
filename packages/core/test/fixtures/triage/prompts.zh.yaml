  short: |
    给 `sync` 命令加一个 --dry-run 标志，只打印将要上传的内容，不真正上传
  spec: |
    CLI 的功能需求：`mytool sync --dry-run`。

    现在的 `sync` 会遍历本地文件夹，把每个文件和远端列表比较，然后上传有变化的文件。我希望能先看看它会做什么。

    行为：
