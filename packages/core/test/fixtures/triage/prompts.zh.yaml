- task: t26
  lang: zh
  from: en
  split: test
  label: { kind: team, level: L3, files: 30, dirs: 10 }
  short: |
    把订单流程从服务之间的同步 REST 调用，迁到基于消息队列的事件驱动架构上
  spec: |
    现在下单是一串同步的 REST 调用：checkout 调 inventory，inventory 调 pricing，然后 checkout 调 payments，最后调 notifications。其中任何一个慢了，整个请求就超时；中间某一步失败，就会给一个并不存在的订单留下被预留的库存。

    我想把这条流程迁到消息队列上的事件。broker 还没选；请推荐一个并说明理由。

    写任何代码之前必须先设计好的内容：
    - 事件(`order.placed`、`stock.reserved`、`stock.rejected`、`payment.captured`、`payment.failed`、`order.confirmed`、`order.cancelled`)及其负载和版本规则。
    - 谁拥有哪个状态，以及取代调用链的 saga，包括每一步的补偿。
    - 投递保证：at-least-once 配合幂等的消费者；每个生产者里放一张 outbox 表，让数据库提交和发布不会不一致；一条死信通道，并且能够重放。
    - 按订单 id 的顺序要求。
    - 现在结果是稍后才到的，checkout 的 API 怎么回应浏览器。

    然后是具体的工作，一个服务一个服务地做：checkout、inventory、pricing、payments 和 notifications 各自要有发布者和消费者、outbox 及其转发器，以及针对它们生产或消费的每个事件的契约测试。服务之间旧的 REST 端点要保留到新通道以影子模式跑过之后；请规划这次迁移和切换，并告诉我每个阶段我们能回滚什么。

    可观测性也是其中一部分：每个事件都带关联 id，并且要有办法看到某个订单卡在了哪里。

