- task: t15
  lang: zh
  from: ko
  split: dev
  label: { kind: direct, level: L1, files: 2, dirs: 2 }
  short: |
    给 deepMerge 加一个拼接数组的选项(arrays: 'concat')。默认和现在一样是替换
  spec: |
    请给 confkit 的 `deepMerge` 加一个选择数组合并方式的选项。这个任务只改一个函数和它的测试。

    ```ts
    interface MergeOptions { arrays?: 'replace' | 'concat' | 'unique' }
    function deepMerge(layers: ConfigObject[], options?: MergeOptions): ConfigObject;
    ```

    规则：
    1. 省略 `arrays` 时是 `'replace'`，和现在的行为一样(后面图层的数组整个替换)。
    2. `'concat'` 时，把同一个键的数组按图层顺序拼接起来。
    3. `'unique'` 和 `'concat'` 一样，但会去掉重复的原始值，并保持首次出现的顺序。
    4. 对于含对象的数组，`'unique'` 按 `JSON.stringify` 的结果比较，而不是按引用。
    5. 一边是数组、另一边不是数组时，不管选项是什么，后面的值胜出。
    6. 嵌套对象里的数组也适用同样的规则。
    7. 任何情况下都不修改输入的图层。
    8. 结果不和输入共享数组引用。
    9. 未知的 `arrays` 值抛出 `ConfigError`。

    现有的调用处是像 `deepMerge(a, b, c)` 这样用可变参数的。这次不要把签名改成上面那样，而是保持现有形式，当最后一个参数形如 `MergeOptions` 时把它解释为选项。代码写在 `src/merge.ts`，测试在 `test/merge.test.ts`。

- task: t16
  lang: zh
  from: ko
  split: test
  label: { kind: team, level: L2, files: 7, dirs: 5 }
  short: |
    给任务加上评论功能
  spec: |
    请给 taskboard 加上任务评论功能。仓储、服务、处理器三层各自按职责分开来做。

    ## 模型
    ```ts
    interface Comment {
      id: string;
      taskId: string;
      authorId: string;
      body: string;        // 1~2000 个字符，以去掉首尾空白后的长度为准
      createdAt: string;   // ISO 8601
      editedAt: string | null;
    }
    ```

    ## 仓储 (`CommentRepo`)
    - `add(comment)`, `listByTask(taskId)`, `get(id)`, `update(id, patch)`, `remove(id)`
    - `listByTask` 按 `createdAt` 升序

    ## 服务 (`CommentService`)
    - 给不存在的任务发评论时抛 `NotFoundError`
    - `body` 校验不通过是 `ValidationError`(details 里有 `'body'`)
    - 只有作者本人可以编辑、删除，否则是 `ForbiddenError`
    - 编辑后填上 `editedAt`
    - 任务被删除时，该任务的评论也一起删掉(在 `TaskService.deleteTask` 里调用)

    ## 处理器
    - `POST /tasks/:id/comments`, `GET /tasks/:id/comments`, `PATCH /comments/:id`, `DELETE /comments/:id`
    - 错误映射和现有处理器一致：Validation 400，Forbidden 403，NotFound 404

    ## 测试
    - 服务和处理器各自的正常与失败情况，以及删除任务时的级联删除

- task: t17
  lang: zh
  from: en
  split: dev
  label: { kind: team, level: L2, files: 6, dirs: 4 }
  short: |
    任务列表的端点需要过滤、排序和分页
  spec: |
    给任务列表加上过滤、排序和分页。现在 `GET /tasks` 把所有任务放在 `{ items }` 里返回。按层拆分工作：过滤本身放在仓储里，校验和默认值放在服务里，查询字符串的解析放在处理器里。

    ## 服务
    新增 `TaskService.queryTasks(query?: TaskQuery): TaskPage`，`listTasks()` 仍然返回完整的数组。

    ```ts
    interface TaskQuery {
      status?: TaskStatus[];        // any of these
      assigneeId?: string | null;   // null = unassigned only
      text?: string;                // case-insensitive match in title
      sort?: 'createdAt' | 'priority' | 'dueDate';
      order?: 'asc' | 'desc';
      page?: number;                // 1-based, default 1
      pageSize?: number;            // default 20, max 100
    }
    interface TaskPage { items: Task[]; total: number; page: number; pageSize: number }
    ```

    ## 仓储
    - `TaskRepo.find(filter, sort, range)` 返回当前页，以及分页前的总数。
    - 按 `priority` 排序时使用 low < medium < high 的顺序；相同时退回到按 `createdAt` 升序。

    ## 处理器
    - `GET /tasks?status=todo,in_progress&assignee=u1&sort=priority&order=desc&page=2&pageSize=50`
    - `assignee=none` 表示未分配。
    - 未知的 status 值、非数字的 page、超过 100 的 `pageSize`，都返回 400 和通常的校验错误响应体。

    ## 测试
    - 仓储：每个过滤条件单独使用、组合使用，每个排序键的两个方向，翻到末尾之后的页。
    - 服务：默认值和校验。
    - 处理器：查询解析和错误映射。

