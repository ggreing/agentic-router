    做一个认证中间件，并给所有处理器加上权限检查
  spec: |
    API 需要加上认证和权限检查。现在所有端点都是敞开的。

    做一个中间件，校验请求里的 `Authorization: Bearer <token>`，并填好 `ctx.user`(id, role)。没有令牌或令牌不对就是 401。然后给所有处理器加上角色检查。查看任务，登录用户都可以；创建和修改需要 `member` 及以上；删除和用户管理只有 `admin` 可以。权限不够就是 403。

    处理器大约有八个(在 `src/handlers/` 下面)，每个处理器的测试也要改成带上认证头。令牌校验作为新模块放在 `src/auth/` 下面，签名密钥从配置里读。角色和允许操作的对应表放在一个地方(`src/auth/policy.ts`)，不要让条件判断散落在各个处理器里。现有的服务层不接收用户信息，只有需要记录作者的 `createTask` 和 `addComment` 改成接收 `actorId`。

