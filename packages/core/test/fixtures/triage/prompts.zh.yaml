  short: |
    CSV 导出时，值里有双引号文件就坏了。做一下转义处理
  spec: |
    CSV 导出的 bug 反馈。只要有任务的标题里带双引号，在 Excel 里列就会错位。

    例：导出标题为 `"긴급" 배포 점검` 的任务，现在的输出是这样的。

    ```
    id,title,status
    t-12,""긴급" 배포 점검",todo
    ```

    期望的输出(RFC 4180)：

    ```
    id,title,status
    t-12,"""긴급"" 배포 점검",todo
    ```

    规则整理如下：
    - 值里只要有双引号、逗号、换行中的任何一个，就用双引号把整个值包起来。
    - 值里面的双引号写成两个。
    - 其他的值和现在一样原样写出。

    应该只改 `src/export/csv.ts` 的 `escapeCell` 就行。请在 `test/export/csv.test.ts` 里加上含双引号、逗号、换行的三种值。

- task: t12
  lang: zh
  from: en
  split: test
  label: { kind: direct, level: L1, files: 2, dirs: 2 }
  short: |
    让 fetchJson 在遇到 5xx 和网络错误时用指数退避重试，最多 3 次
  spec: |
    `src/net/fetchJson.ts` 里的 `fetchJson` 第一次失败就放弃了。我希望它能重试。

    规则：
    1. 网络错误和 HTTP 500 到 599 时重试。4xx 绝不重试。
    2. 总共最多尝试 3 次(也就是重试 2 次)。
    3. 第二次尝试前等 200 ms，第三次前等 400 ms。
    4. 如果每次尝试都失败，原样抛出最后一个错误。
    5. 调用方传入的 `AbortSignal` 会立刻中止等待，并以中止原因 reject。
    6. 调用方可以用 `{ retries: 0 }` 关掉重试；默认是 2。

    修改后的签名：

    ```ts
    export interface FetchJsonOptions { retries?: number; signal?: AbortSignal }
    export function fetchJson<T>(url: string, options?: FetchJsonOptions): Promise<T>;
    ```

    现有的调用方都不传选项，必须继续正常工作。测试放在 `test/net/fetchJson.test.ts`；这个文件里已经有一个可以用的假服务器辅助函数，另外请使用假定时器，这样测试就不用真的等待。

