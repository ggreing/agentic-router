    把错误信息全部换成消息键，并配上韩语/英语的文案目录
  spec: |
    展示给用户的错误信息以韩语字符串的形式散落在代码各处。因为要接入英语用户，我们打算把信息换成键，再从按语言划分的目录里取出来用。

    方式是这样设想的。在 `src/i18n/` 下面放 `ko.json`、`en.json` 两个目录，以及 `t(key, params, locale)` 函数。键采用 `task.not_found`、`validation.required` 这样的点号写法，值里可以使用 `{name}` 形式的占位符。错误类不再带信息字符串，而是带 `code` 和 `params`，在生成响应的最后一步(`src/handlers/http.ts` 的错误映射)根据请求的 `Accept-Language` 转成句子。不支持的语言一律返回韩语。

    需要改的地方是所有抛错误的服务(任务、用户、评论、项目)、校验工具，以及处理器的错误映射。有不少测试是直接比较信息字符串的，这些要改成比较 `code`，句子本身只在目录的测试里确认一次。为了让使用了目录里没有的键时测试能发现，请再加一个测试，确认两个目录的键集合相同，并且代码里用到的键都在其中。

- task: t23
  lang: zh
  from: en
  split: dev
  label: { kind: team, level: L2, files: 8, dirs: 5 }
  short: |
    删除任务应该是软删除，这样我们还能恢复
  spec: |
    我们现在是真的把任务删掉，而客服一直在要求把某个任务找回来。请把删除改成软删除。

    ## 模型
    - `Task` 增加 `deletedAt: string | null`(ISO 8601)。它不为 null 时，任务就是已删除。

    ## 仓储
    - `remove(id)` 设置 `deletedAt`，而不是删掉这一行。
    - `get`、`list` 和 `find` 跳过已删除的任务，除非调用时带了 `{ includeDeleted: true }`。
    - 新增 `restore(id)`，清掉 `deletedAt`。
    - 新增 `purge(olderThan: Date)`，真正移除在该日期之前被删除的任务。

    ## 服务
    - 从调用方的角度看，`deleteTask` 的行为不变：任务消失，第二次删除是 404。
    - 对从未被删除或不存在的任务，`restoreTask(id)` 以 `NotFoundError` 失败。
    - 已删除任务的评论和审计事件保留；它们随任务一起回来。
    - 计数和周报忽略已删除的任务。

    ## HTTP
    - `DELETE /tasks/:id` 对客户端来说不变。
    - `POST /tasks/:id/restore`，仅管理员可用。
    - `GET /tasks?deleted=only`，仅管理员可用，列出回收站。

    ## 迁移和日常清理
    - 用一次迁移加上这一列，所有现有行都为 null。
    - 一个每日任务以当前时间减 30 天调用 `purge`。

    ## 测试
    - 仓储、服务和处理器各个层面，加上在已经有任务的数据库上跑迁移。

