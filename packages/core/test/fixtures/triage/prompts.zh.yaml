- task: t20
  lang: zh
  from: ko
  split: test
  label: { kind: team, level: L2, files: 7, dirs: 5 }
  short: |
    记录一下变更历史，好让我们能看到是谁在什么时候改了任务
  spec: |
    请给 taskboard 加上任务的变更历史。要能按任务查到是谁、在什么时候、改了什么。

    ## 事件模型
    ```ts
    type AuditEventType = 'task.created' | 'task.assigned' | 'task.status_changed' | 'task.deleted';
    interface AuditEvent {
      id: string;
      taskId: string;
      type: AuditEventType;
      actorId: string | null;
      at: string;                       // ISO 8601
      before: Record<string, unknown> | null;
      after: Record<string, unknown> | null;
    }
    ```

    ## 记录时机
    1. `createTask`：`task.created`，`after` 里是创建出来的任务
    2. `assignTask`：`task.assigned`，`before`/`after` 里只有 `assigneeId`
    3. `changeStatus`：只有状态真的变了才记 `task.status_changed`
    4. `deleteTask`：`task.deleted`，`before` 里是删除前的任务
    5. 失败的请求(校验失败、409)不记录

    ## 存储和查询
    - `AuditRepo.append(event)`、`AuditRepo.listByTask(taskId)`(按时间顺序)
    - `GET /tasks/:id/audit` 以 `{ items }` 响应，任务不存在时 404
    - 已删除任务的历史必须保留，也能查询

    ## 其他
    - `actorId` 由处理器从请求上下文里取出，再传给服务
    - 在服务方法的签名里把 `actorId` 加为最后一个可选参数
    - 补上服务和处理器的测试

- task: t21
  lang: zh
  from: en
  split: dev
  label: { kind: team, level: L2, files: 9, dirs: 3 }
  short: |
    把数据访问层从回调改成 async/await
  spec: |
    数据访问层还在用 Node 风格的回调，而它上面的所有代码都用 Promise，所以每个服务都得手工把仓储调用包进 `new Promise(...)`。我希望仓储直接返回 Promise。

    `src/repo/` 下面有五个仓储文件(users, tasks, comments, tags, sessions)，外加它们每一个都会调用的共用辅助模块 `src/repo/db.ts`。每个导出的函数现在接收 `(args..., cb)`；改完之后接收 `(args...)`，并返回一个 Promise，它 reject 时用的错误对象和以前回调收到的一样。`db.ts` 里的辅助模块要把 `query` 和 `transaction` 作为返回 Promise 的函数暴露出来，而且 `transaction` 在它运行的函数 reject 时必须回滚。

    然后是调用方：`src/service/` 下面的三个服务应该去掉手写的包装，直接 `await` 仓储调用。行为不能变，包括事务内查询的顺序，以及哪些错误会暴露出来。

    仓储的测试用的是一个基于回调的假 `db`；这个假对象也需要做同样的转换。请用一种能在每转换完一个仓储后测试套件都保持通过的方式来做，这样这次改动就可以一个文件一个文件地评审。

- task: t22
