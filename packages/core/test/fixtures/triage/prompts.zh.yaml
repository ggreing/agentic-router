  label: { kind: direct, level: L1, files: 2, dirs: 1 }
  short: |
    test/report/weekly.test.ts 在 CI 上失败，本地却能过，我觉得是时区的问题。能把这个测试修好吗
  spec: |
    我们有一个不稳定的测试。`test/report/weekly.test.ts` 里的 `weekly report groups tasks by ISO week`，在首尔的每一台笔记本上都能过，在跑 UTC 的 CI 上却失败。

    ```
    AssertionError [ERR_ASSERTION]: Expected values to be strictly equal:
