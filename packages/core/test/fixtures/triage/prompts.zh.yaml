  short: |
    上传日志里写的是 "MB"，但数字其实是 KB，把这条信息改对
  spec: |
    看生产日志时注意到的一个小问题。上传处理器会把每个被接受的文件的大小这样记下来：

    ```
    upload accepted: report-2026-10.pdf (48213 MB)
    ```

    这个数字是 `file.size / 1024`，所以是千字节，不是兆字节。48 GB 的 PDF 可就太厉害了。

    请把信息里的单位改成 "KB"。计算保持原样：解析这些日志行的仪表盘只读数字、忽略单位，所以改数字会弄坏仪表盘，而改单位的文字是安全的。这一行在 `src/upload/handler.ts` 里，处理 "accepted" 情况的那个函数中。这样的日志调用只有一处。

