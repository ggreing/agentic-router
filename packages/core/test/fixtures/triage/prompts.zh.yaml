  spec: |
    现场技术人员在没有信号的地下室和屋顶上使用我们的移动应用，而现在这个应用在那些地方毫无用处：每个页面都从 API 加载，每次编辑都是一次请求。我希望应用能完全离线工作，并在连接恢复时同步。

    这等于把客户端的数据层重做一遍，需要先做设计。我能想到的问题有：设备上的本地存储，作为 UI 的唯一数据来源(用哪种数据库，什么样的 schema，在应用版本之间怎么迁移)；一个本地改动的队列，带有在设备上生成的稳定 id；一套和服务器之间的同步协议，把这些改动发出去，并拉取别人的改动，断线之后可以续传，而且开销足够小，可以频繁运行；还有冲突处理。对于冲突，我不想在整条记录上用“最后写入者胜出”。两位技术人员编辑同一张工单的不同字段时，各自的改动都应该保留；同一个字段上真正的冲突应该展示给用户。照片和签名体积很大，需要自己的、带重试的上传通道。

    服务器端也需要配套的工作：按用户的变更流，幂等地接收批量改动，以及为删除保留墓碑标记，这样一台离线了两周的设备就不会让已删除的记录复活。

    应用里的每个页面都要从“先请求再渲染”改成读取本地存储并监听它，而且 UI 需要显示同步状态和待提交的改动。请在写代码之前，先从一份设计文档开始，内容涵盖存储、协议和冲突规则，以及现有安装的迁移计划。
