    - 带上这个标志时，命令照常执行到上传调用之前，然后对每个将要上传的文件打印一行，格式是 `would upload <relative path> (<size> bytes)`，最后再打印一行 `N file(s) would be uploaded`。
    - 不发生任何网络写入。读取远端列表没问题。
    - 列表读取成功时，退出码和现在一样是 0。
    - `--help` 会列出这个标志，并附一行说明。

    这个命令在 `src/commands/sync.ts` 里；上传本身就是靠近末尾的那一次 `uploader.put()` 调用。请在 `test/commands/sync.test.ts` 里已有测试的旁边加一个测试，检查设置了该标志时什么都没有上传。

