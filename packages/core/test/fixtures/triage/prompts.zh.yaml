    - `loadConfig(sources)` 按顺序读取它们，并用现有的 `deepMerge` 合并。
    - 校验和类型转换只做一次，在合并之后，由 `src/config/schema.ts` 里的 schema 对象驱动(string, number, boolean, enum, required, default)。来自环境变量的 `port: '8080'` 在那里变成数字 8080；缺少必填值或类型不对时，一次报告所有问题，而不是只报第一个。
