- task: t23
  lang: zh-Hant
  from: en
  split: dev
  label: { kind: team, level: L2, files: 8, dirs: 5 }
  short: |
    刪除任務應該是軟刪除，這樣我們還能還原
  spec: |
    我們現在是真的把任務刪掉，而客服一直在要求把某個任務找回來。請把刪除改成軟刪除。

    ## 模型
    - `Task` 增加 `deletedAt: string | null`(ISO 8601)。它不為 null 時，任務就是已刪除。

    ## 儲存庫
    - `remove(id)` 設定 `deletedAt`，而不是刪掉這一列。
    - `get`、`list` 和 `find` 跳過已刪除的任務，除非呼叫時帶了 `{ includeDeleted: true }`。
    - 新增 `restore(id)`，清掉 `deletedAt`。
    - 新增 `purge(olderThan: Date)`，真正移除在那個日期之前被刪除的任務。

    ## 服務
    - 從呼叫端的角度看，`deleteTask` 的行為不變：任務消失，第二次刪除是 404。
    - 對從未被刪除或不存在的任務，`restoreTask(id)` 以 `NotFoundError` 失敗。
    - 已刪除任務的留言和稽核事件保留；它們隨任務一起回來。
    - 計數和週報忽略已刪除的任務。

    ## HTTP
    - `DELETE /tasks/:id` 對用戶端來說不變。
    - `POST /tasks/:id/restore`，僅管理員可用。
    - `GET /tasks?deleted=only`，僅管理員可用，列出垃圾桶。

    ## 遷移和日常清理
    - 用一次遷移加上這一欄，所有現有列都為 null。
    - 一個每日任務以目前時間減 30 天呼叫 `purge`。

    ## 測試
    - 儲存庫、服務和處理器各個層面，加上在已經有任務的資料庫上跑遷移。

