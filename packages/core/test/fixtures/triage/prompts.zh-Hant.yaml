- task: t20
  lang: zh-Hant
  from: ko
  split: test
  label: { kind: team, level: L2, files: 7, dirs: 5 }
  short: |
    記錄一下變更歷史，好讓我們能看到是誰在什麼時候改了任務
  spec: |
    請幫 taskboard 加上任務的變更歷史。要能按任務查到是誰、在什麼時候、改了什麼。

    ## 事件模型
    ```ts
    type AuditEventType = 'task.created' | 'task.assigned' | 'task.status_changed' | 'task.deleted';
    interface AuditEvent {
      id: string;
      taskId: string;
      type: AuditEventType;
      actorId: string | null;
      at: string;                       // ISO 8601
      before: Record<string, unknown> | null;
      after: Record<string, unknown> | null;
    }
    ```

    ## 記錄時機
    1. `createTask`：`task.created`，`after` 裡是建立出來的任務
    2. `assignTask`：`task.assigned`，`before`/`after` 裡只有 `assigneeId`
    3. `changeStatus`：只有狀態真的變了才記 `task.status_changed`
    4. `deleteTask`：`task.deleted`，`before` 裡是刪除前的任務
    5. 失敗的請求(驗證失敗、409)不記錄

    ## 儲存和查詢
    - `AuditRepo.append(event)`、`AuditRepo.listByTask(taskId)`(按時間順序)
    - `GET /tasks/:id/audit` 以 `{ items }` 回應，任務不存在時 404
    - 已刪除任務的歷史必須保留，也能查詢

    ## 其他
    - `actorId` 由處理器從請求上下文取出，再傳給服務
    - 在服務方法的簽章裡把 `actorId` 加成最後一個選用參數
    - 補上服務和處理器的測試

- task: t21
  lang: zh-Hant
  from: en
  split: dev
  label: { kind: team, level: L2, files: 9, dirs: 3 }
  short: |
    把資料存取層從 callback 改成 async/await
  spec: |
    資料存取層還在用 Node 風格的 callback，而它上面的所有程式都用 Promise，所以每個服務都得手動把儲存庫呼叫包進 `new Promise(...)`。我希望儲存庫直接回傳 Promise。

    `src/repo/` 底下有五個儲存庫檔案(users, tasks, comments, tags, sessions)，外加它們每一個都會用到的共用輔助模組 `src/repo/db.ts`。每個匯出的函式現在接收 `(args..., cb)`；改完之後接收 `(args...)`，並回傳一個 Promise，它 reject 時用的錯誤物件跟以前 callback 收到的一樣。`db.ts` 裡的輔助模組要把 `query` 和 `transaction` 當成回傳 Promise 的函式對外提供，而且 `transaction` 在它執行的函式 reject 時一定要復原。

    然後是呼叫端：`src/service/` 底下的三個服務應該拿掉手寫的包裝，直接 `await` 儲存庫呼叫。行為不能變，包括交易內查詢的順序，以及哪些錯誤會往外拋。

    儲存庫的測試用的是一個以 callback 為基礎的假 `db`；這個假物件也要做同樣的轉換。請用一種每轉換完一個儲存庫、整個測試套件都保持通過的方式來做，這樣這次改動就可以一個檔案一個檔案地審查。

