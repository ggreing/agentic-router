- task: t14
  lang: zh-Hant
  from: en
  split: test
  label: { kind: direct, level: L1, files: 2, dirs: 1 }
  short: |
    test/report/weekly.test.ts 在 CI 上失敗，本機卻會過，我覺得是時區的問題。可以把這個測試修好嗎
  spec: |
    我們有一個不穩定的測試。`test/report/weekly.test.ts` 裡的 `weekly report groups tasks by ISO week`，在台北的每一台筆電上都會過，在跑 UTC 的 CI 上卻失敗。

    ```
    AssertionError [ERR_ASSERTION]: Expected values to be strictly equal:
    + actual - expected

    + '2026-W45'
    - '2026-W46'
        at TestContext.<anonymous> (test/report/weekly.test.ts:41:10)
    ```

    目前查到的狀況：
    - 測試的 fixture 用 `new Date(2026, 10, 9, 0, 30)` 建日期，這是本地時間。
    - 在 UTC 下，那個時刻還是 8 號星期日，屬於第 45 週。
    - 正式程式(`src/report/weekly.ts`)接受一個 `timeZone` 參數，就我所見是正確的。

    所以我認為錯的是測試，不是程式。請讓 fixture 不依賴機器的時區(用帶明確時差的 ISO 字串來建日期，並給函式傳 `timeZone: 'Asia/Taipei'`)，如果 `test/report/helpers.ts` 裡的共用輔助函式也是這樣建日期的，那裡也一併修掉。除非你發現 `src/report/weekly.ts` 真的有錯，否則不要改它；如果真的有錯，改之前先告訴我。

- task: t15
  lang: zh-Hant
  from: ko
  split: dev
  label: { kind: direct, level: L1, files: 2, dirs: 2 }
  short: |
    給 deepMerge 加一個串接陣列的選項(arrays: 'concat')。預設跟現在一樣是取代
  spec: |
    請給 confkit 的 `deepMerge` 加一個選擇陣列合併方式的選項。這個任務只改一個函式和它的測試。

    ```ts
    interface MergeOptions { arrays?: 'replace' | 'concat' | 'unique' }
    function deepMerge(layers: ConfigObject[], options?: MergeOptions): ConfigObject;
    ```

    規則：
    1. 省略 `arrays` 時是 `'replace'`，跟現在的行為一樣(後面圖層的陣列整個取代)。
    2. `'concat'` 時，把同一個鍵的陣列按圖層順序串起來。
    3. `'unique'` 跟 `'concat'` 一樣，但會拿掉重複的原始值，並保留第一次出現的順序。
    4. 對於含物件的陣列，`'unique'` 按 `JSON.stringify` 的結果比較，而不是按參考。
    5. 一邊是陣列、另一邊不是陣列時，不管選項是什麼，後面的值勝出。
    6. 巢狀物件裡的陣列也套用同樣的規則。
    7. 任何情況下都不改動輸入的圖層。
    8. 結果不和輸入共用陣列參考。
    9. 未知的 `arrays` 值丟出 `ConfigError`。

    現有的呼叫端是像 `deepMerge(a, b, c)` 這樣用可變參數的。這次不要把簽章改成上面那樣，而是維持現有形式，當最後一個參數長得像 `MergeOptions` 時就把它當成選項。程式寫在 `src/merge.ts`，測試在 `test/merge.test.ts`。

- task: t16
  lang: zh-Hant
  from: ko
  split: test
  label: { kind: team, level: L2, files: 7, dirs: 5 }
  short: |
    幫任務加上留言功能
  spec: |
    請幫 taskboard 加上任務留言功能。儲存庫、服務、處理器三層各自照職責分開做。

    ## 模型
    ```ts
    interface Comment {
      id: string;
      taskId: string;
      authorId: string;
      body: string;        // 1~2000 個字元，以去掉前後空白後的長度為準
      createdAt: string;   // ISO 8601
      editedAt: string | null;
    }
    ```

    ## 儲存庫 (`CommentRepo`)
    - `add(comment)`, `listByTask(taskId)`, `get(id)`, `update(id, patch)`, `remove(id)`
    - `listByTask` 按 `createdAt` 由舊到新

    ## 服務 (`CommentService`)
    - 給不存在的任務留言時丟 `NotFoundError`
    - `body` 驗證不過是 `ValidationError`(details 裡有 `'body'`)
    - 只有作者本人可以編輯、刪除，否則是 `ForbiddenError`
    - 編輯後填上 `editedAt`
    - 任務被刪除時，該任務的留言也一起刪掉(在 `TaskService.deleteTask` 裡呼叫)

    ## 處理器
    - `POST /tasks/:id/comments`, `GET /tasks/:id/comments`, `PATCH /comments/:id`, `DELETE /comments/:id`
    - 錯誤對應跟現有處理器一致：Validation 400，Forbidden 403，NotFound 404

    ## 測試
    - 服務和處理器各自的正常與失敗情況，以及刪除任務時的連鎖刪除

