  short: |
    上傳記錄裡寫的是 "MB"，但數字其實是 KB，把這條訊息改對
  spec: |
    看正式環境記錄檔時注意到的一個小問題。上傳處理器會把每個被接受的檔案大小這樣記下來：

    ```
