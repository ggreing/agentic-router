    5. 開發者體驗：樣板、型別宣告、`mytool plugin doctor` 指令。

    ## 遷移
    - 把三個內建匯出器(csv, json, markdown)和 `stats` 指令搬到同一套 API 上，讓核心自己也用它提供給別人的機制。
    - 對不安裝外掛的人，行為沒有變化。

    ## 交付物
    - 先出一份設計文件，供審查。
    - 載入器、帶型別宣告的 API 套件、遷移後的內建功能、針對載入、衝突和出錯外掛的測試，以及含一個完整範例外掛的文件。

