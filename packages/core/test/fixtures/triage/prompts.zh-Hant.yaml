- task: t30
  lang: zh-Hant
  from: en
  split: test
  label: { kind: team, level: L3, files: 35, dirs: 9 }
  short: |
    行動端需要能離線使用，並在重新連線後同步
  spec: |
    現場技師在沒有訊號的地下室和屋頂上用我們的行動 App，而現在這個 App 在那些地方毫無用處：每個頁面都從 API 載入，每次編輯都是一次請求。我希望 App 能完全離線運作，並在連線恢復時同步。

    這等於把用戶端的資料層重做一遍，需要先做設計。我想得到的問題有：裝置上的本機儲存，作為 UI 的唯一資料來源(用哪種資料庫、什麼樣的 schema、在 App 版本之間怎麼遷移)；一個本機變更的佇列，帶有在裝置上產生的穩定 id；一套和伺服器之間的同步協定，把這些變更送出去，並拉取別人的變更，斷線之後可以續傳，而且開銷夠小、可以常常執行；還有衝突處理。對於衝突，我不想在整筆記錄上用「最後寫入者勝出」。兩位技師編輯同一張工單的不同欄位時，各自的變更都應該保留；同一個欄位上真正的衝突應該呈現給使用者。照片和簽名體積很大，需要自己的、帶重試的上傳通道。

    伺服器端也需要配套的工作：按使用者的變更流、冪等地接收批次變更，以及為刪除保留墓碑標記，這樣一台離線兩週的裝置就不會讓已刪除的記錄復活。

    App 裡的每個頁面都要從「先請求再繪製」改成讀取本機儲存並監聽它，而且 UI 需要顯示同步狀態和待送出的變更。請在寫程式之前，先從一份設計文件開始，內容涵蓋儲存、協定和衝突規則，以及現有安裝的遷移計畫。
