    這個數字是 `file.size / 1024`，所以是 KB，不是 MB。48 GB 的 PDF 那可就厲害了。

    請把訊息裡的單位改成 "KB"。計算維持原樣：解析這些記錄行的儀表板只讀數字、忽略單位，所以改數字會弄壞儀表板，改單位的文字才是安全的。這一行在 `src/upload/handler.ts` 裡，處理 "accepted" 情況的那個函式中。這種記錄呼叫只有一處。

