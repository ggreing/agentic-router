    - 值裡只要有雙引號、逗號、換行其中之一，就用雙引號把整個值包起來。
    - 值裡面的雙引號寫成兩個。
    - 其他的值跟現在一樣原樣寫出。

    應該只改 `src/export/csv.ts` 的 `escapeCell` 就行。請在 `test/export/csv.test.ts` 裡加上含雙引號、逗號、換行的三種值。

- task: t12
  lang: zh-Hant
  from: en
  split: test
  label: { kind: direct, level: L1, files: 2, dirs: 2 }
  short: |
    讓 fetchJson 在碰到 5xx 和網路錯誤時用指數退避重試，最多 3 次
  spec: |
    `src/net/fetchJson.ts` 裡的 `fetchJson` 第一次失敗就放棄了。我希望它能重試。

    規則：
    1. 網路錯誤和 HTTP 500 到 599 時重試。4xx 絕不重試。
    2. 總共最多嘗試 3 次(也就是重試 2 次)。
    3. 第二次嘗試前等 200 ms，第三次前等 400 ms。
    4. 如果每次嘗試都失敗，原樣丟出最後一個錯誤。
    5. 呼叫端傳進來的 `AbortSignal` 會立刻中止等待，並以中止原因 reject。
    6. 呼叫端可以用 `{ retries: 0 }` 關掉重試；預設是 2。

    改完後的簽章：

    ```ts
    export interface FetchJsonOptions { retries?: number; signal?: AbortSignal }
    export function fetchJson<T>(url: string, options?: FetchJsonOptions): Promise<T>;
    ```

    現有的呼叫端都不傳選項，必須繼續正常運作。測試放在 `test/net/fetchJson.test.ts`；這個檔案裡已經有一個可以用的假伺服器輔助函式，另外請用假的計時器，這樣測試就不用真的等待。

