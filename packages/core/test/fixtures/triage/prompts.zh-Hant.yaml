    幫任務列表加上過濾、排序和分頁。現在 `GET /tasks` 把所有任務放在 `{ items }` 裡回傳。按層拆分工作：過濾本身放在儲存庫裡，驗證和預設值放在服務裡，查詢字串的解析放在處理器裡。

    ## 服務
    新增 `TaskService.queryTasks(query?: TaskQuery): TaskPage`，`listTasks()` 仍然回傳完整的陣列。

    ```ts
    interface TaskQuery {
      status?: TaskStatus[];        // any of these
      assigneeId?: string | null;   // null = unassigned only
      text?: string;                // case-insensitive match in title
      sort?: 'createdAt' | 'priority' | 'dueDate';
      order?: 'asc' | 'desc';
      page?: number;                // 1-based, default 1
      pageSize?: number;            // default 20, max 100
    }
    interface TaskPage { items: Task[]; total: number; page: number; pageSize: number }
    ```

    ## 儲存庫
    - `TaskRepo.find(filter, sort, range)` 回傳目前這一頁，以及分頁前的總數。
    - 按 `priority` 排序時用 low < medium < high 的順序；相同時退回按 `createdAt` 由舊到新。

    ## 處理器
    - `GET /tasks?status=todo,in_progress&assignee=u1&sort=priority&order=desc&page=2&pageSize=50`
    - `assignee=none` 代表未指派。
    - 未知的 status 值、非數字的 page、超過 100 的 `pageSize`，都回 400 和一般的驗證錯誤回應內容。

    ## 測試
    - 儲存庫：每個過濾條件單獨使用、組合使用，每個排序鍵的兩個方向，翻到最後一頁之後的頁。
    - 服務：預設值和驗證。
    - 處理器：查詢解析和錯誤對應。

