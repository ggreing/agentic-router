- task: t21
  lang: en
  split: dev
  label: { kind: team, level: L2, files: 9, dirs: 3 }
  short: |
    convert the data access layer from callbacks to async/await
  spec: |
    The data access layer still uses Node-style callbacks while everything above it uses promises, so each service wraps repository calls in `new Promise(...)` by hand. I want the repositories to return promises directly.

    There are five repository files under `src/repo/` (users, tasks, comments, tags, sessions) plus the shared `src/repo/db.ts` helper that every one of them calls. Each exported function currently takes `(args..., cb)`; after the change it takes `(args...)` and returns a promise that rejects with the same error objects the callback used to receive. The helper in `db.ts` should expose `query` and `transaction` as promise-returning functions, and `transaction` must roll back when the function it runs rejects.

    Then the callers: the three services under `src/service/` should drop their hand-written wrappers and simply `await` the repository calls. Behaviour must not change, including the order of queries inside a transaction and which errors are surfaced.

    The repository tests use a fake `db` with callbacks; that fake needs the same conversion. Please do it in a way that keeps the test suite green after each repository is converted, so the change can be reviewed file by file.

