  label: { kind: team, level: L3, files: 60, dirs: 15 }
  short: |
    지금 모놀리식 구조를 모듈 경계가 분명하게 전면 재설계하고 싶어. 패키지 분리까지
  spec: |
    코드베이스가 `src/` 하나에 300개 넘는 파일로 뒤엉켜 있고, 서로를 아무 방향으로나 import합니다. 기능 하나를 고치면 관계없는 테스트가 깨지는 일이 잦습니다. 구조를 다시 잡으려 합니다.

    ## 목표
    - 도메인별 모듈(계정, 프로젝트, 태스크, 알림, 결제, 리포트)로 경계를 나누고, 모듈은 공개 진입점(`index.ts`)으로만 서로를 씁니다.
    - 의존 방향을 한쪽으로 정합니다: 도메인 → 공용 유틸은 되지만 반대는 안 되고, 도메인끼리는 정해진 방향만 허용합니다.
    - 순환 의존을 없앱니다(현재 40개 이상).
    - 저장소 접근과 HTTP는 각 모듈 안의 바깥 계층으로 밀어내고, 도메인 로직은 그것들을 모릅니다.
    - 워크스페이스 패키지로 나눌 수 있는 것은 나눕니다.

    ## 먼저 필요한 것
    1. 현재 의존 그래프 분석과 모듈 경계 제안
    2. 단계별 이전 계획: 한 번에 다 옮기지 않고, 각 단계가 끝날 때마다 빌드와 테스트가 통과해야 합니다
    3. 경계를 강제할 방법(lint 규칙이나 의존성 검사)과 CI 연결
    4. 공용으로 남길 것과 모듈로 내려보낼 것의 기준

    ## 제약
    - 외부 API와 데이터베이스 스키마는 바꾸지 않습니다
    - 이전 중에도 기능 개발은 계속되므로, 큰 브랜치 하나가 아니라 작은 변경 여러 개로 진행합니다

- task: t30
  lang: en
  split: test
  label: { kind: team, level: L3, files: 35, dirs: 9 }
  short: |
    the mobile client needs to work offline and sync when it's back online
  spec: |
    Field technicians use our mobile app in basements and on rooftops with no signal, and today the app is useless there: every screen loads from the API and every edit is a request. I want the app to work fully offline and synchronise when the connection returns.

    This is a rewrite of the client's data layer and it needs a design first. The questions I can see: a local store on the device as the source of truth for the UI (which database, what schema, how it migrates between app versions); a queue of local changes with stable ids generated on the device; a sync protocol with the server that sends those changes and pulls what others changed, resumable after a dropped connection and cheap enough to run often; and conflict handling. For conflicts I do not want "last write wins" on whole records. Two technicians editing different fields of the same work order should both keep their change, and a real conflict on one field should be shown to the user. Photos and signatures are large and need their own upload path with retry.

    The server needs matching work: change feeds per user, accepting batched changes idempotently, and tombstones for deletions so that a device that was offline for two weeks does not resurrect deleted records.

    Every screen in the app has to move from "fetch then render" to reading the local store and observing it, and the UI needs to show sync state and pending changes. Please start with a design document covering the store, the protocol and the conflict rules, with the migration plan for existing installs, before writing code.
