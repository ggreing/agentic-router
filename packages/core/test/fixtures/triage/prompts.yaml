- task: t23
  lang: en
  split: dev
  label: { kind: team, level: L2, files: 8, dirs: 5 }
  short: |
    deleting a task should be a soft delete so we can restore it
  spec: |
    We delete tasks for real today, and support keeps asking us to bring one back. Make deletion soft.

    ## Model
    - `Task` gets `deletedAt: string | null` (ISO 8601). A task is deleted when it is not null.

    ## Repository
    - `remove(id)` sets `deletedAt` instead of dropping the row.
    - `get`, `list` and `find` skip deleted tasks unless called with `{ includeDeleted: true }`.
    - New `restore(id)` clears `deletedAt`.
    - New `purge(olderThan: Date)` really removes tasks deleted before that date.

    ## Service
    - `deleteTask` keeps its behaviour from the caller's point of view: the task disappears, a second delete is a 404.
    - `restoreTask(id)` fails with `NotFoundError` for a task that was never deleted or does not exist.
    - Comments and audit events of a deleted task stay; they come back with it.
    - Counts and the weekly report ignore deleted tasks.

    ## HTTP
    - `DELETE /tasks/:id` unchanged for clients.
    - `POST /tasks/:id/restore` for admins.
    - `GET /tasks?deleted=only` for admins lists the trash.

    ## Migration and housekeeping
    - A migration adds the column with null for every existing row.
    - A daily job calls `purge` with now minus 30 days.

    ## Tests
    - Repository, service and handler level, plus the migration on a database that already has tasks.

