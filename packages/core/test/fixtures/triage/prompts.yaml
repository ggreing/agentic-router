  split: test
  label: { kind: team, level: L2, files: 7, dirs: 5 }
  short: |
    태스크에 댓글 기능 넣어줘
  spec: |
    taskboard에 태스크 댓글 기능을 추가해 주세요. 저장소, 서비스, 핸들러 계층에 각각 맞게 나눠서 구현합니다.

    ## 모델
    ```ts
    interface Comment {
      id: string;
      taskId: string;
      authorId: string;
      body: string;        // 1~2000자, 앞뒤 공백 제거 후 기준
      createdAt: string;   // ISO 8601
      editedAt: string | null;
    }
    ```

    ## 저장소 (`CommentRepo`)
    - `add(comment)`, `listByTask(taskId)`, `get(id)`, `update(id, patch)`, `remove(id)`
    - `listByTask`는 `createdAt` 오름차순

    ## 서비스 (`CommentService`)
    - 존재하지 않는 태스크에 댓글을 달면 `NotFoundError`
    - `body` 검증 실패는 `ValidationError`(details에 `'body'`)
