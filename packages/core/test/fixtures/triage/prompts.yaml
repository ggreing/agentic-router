    방식이 정해지면 바뀌는 범위는 이렇습니다. 인증 토큰에 테넌트가 들어가고, 요청마다 테넌트 컨텍스트가 설정되어 저장소 계층의 모든 쿼리에 자동으로 적용되어야 합니다. 개별 쿼리에서 조건을 빠뜨려도 다른 고객사 데이터가 보이지 않도록 하는 것이 핵심입니다. 모든 테이블에 마이그레이션이 필요하고, 기존 데이터는 첫 번째 고객사 소유로 채웁니다. 고유 제약(이메일, 프로젝트 키 등)은 테넌트 범위로 바뀝니다. 캐시 키, 백그라운드 작업, 파일 저장 경로, 검색 색인, 감사 로그에도 테넌트가 들어가야 합니다. 관리자용으로 테넌트를 만들고 정지시키는 API도 필요합니다.

