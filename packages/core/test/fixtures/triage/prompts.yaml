- task: t28
  lang: en
  split: test
  label: { kind: team, level: L3, files: 22, dirs: 7 }
  short: |
    design and build a plugin system so third parties can add commands and exporters to the CLI
  spec: |
    People keep sending pull requests that add one more exporter or one more subcommand to the CLI, and we do not want to own all of them. I want a plugin system so they can ship those themselves.

    ## What a plugin can do
    - Register commands (name, options, handler).
    - Register exporters for the `export` command (format name, file extension, a function from our data model to bytes).
    - Hook into `beforeSync` and `afterSync`.

    ## What needs designing
    1. The extension API and its stability promise: a versioned `PluginApi` object, what is public, how we deprecate.
    2. Discovery and loading: plugins are npm packages named `mytool-plugin-*`, listed in the config file; load order; what happens when two plugins register the same name.
    3. Isolation: a plugin that throws during load or inside a hook must not take the CLI down; decide how far we go (try/catch, worker threads, permissions).
    4. Configuration: each plugin gets its own validated section of the config file.
    5. Developer experience: a template, typings, a `mytool plugin doctor` command.

    ## Migration
    - Move the three built-in exporters (csv, json, markdown) and the `stats` command onto the same API, so the core uses the mechanism it offers to others.
    - No behaviour change for people who install no plugins.

    ## Deliverables
    - A design document first, for review.
    - The loader, the API package with typings, the migrated built-ins, tests for loading, conflicts and failing plugins, and documentation with one worked example plugin.

