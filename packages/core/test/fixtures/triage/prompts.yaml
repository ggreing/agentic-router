# Triage evaluation prompts (decision 111): 30 tasks x 2 wordings = 60 prompts.
#
# Every task is written twice: `short` is how a hurried user would type it, `spec` spells the same
# task out. The label belongs to the task, not to the wording, so a classifier that only reads the
# length or the layout of a request gets one wording of each task wrong.
#
# label.kind   direct = one engineer, a few edits; team = 4+ files, or 2+ modules/layers, or a design decision first
# label.level  L0 trivial, L1 small (1-3 files), L2 module-level, L3 new service / architecture / 10+ files
# label.files, label.dirs   the change the author had in mind (a proxy label; nothing here was executed)
# split        dev = may be used to tune stage-1 rules; test = report only
#
# Limits: one author wrote the prompts, the labels and the rules, and the projects are imaginary.
# Measured outcomes (decision 107) and real requests outrank this set.

