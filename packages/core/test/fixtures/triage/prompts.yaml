- task: t19
  lang: en
  split: dev
  label: { kind: team, level: L2, files: 8, dirs: 3 }
  short: |
    refactor config loading: defaults, file and env should be separate sources merged in order, with schema validation at the end
  spec: |
    Our configuration loading has grown into one 400-line function (`loadConfig` in `src/config/load.ts`) that reads a JSON file, overlays environment variables with hand-written `if` blocks, and validates as it goes. Every new setting means touching four places. I would like it restructured.

    Target shape:
    - A `ConfigSource` interface with one method, `read(): Promise<ConfigObject>`.
    - Three sources: `DefaultsSource`, `FileSource(path)` and `EnvSource(prefix)`. The env source maps `APP_DB__HOST` to `db.host` (double underscore = nesting) and converts nothing; values stay strings.
    - `loadConfig(sources)` reads them in order and merges with the existing `deepMerge`.
    - Validation and type coercion happen once, after merging, driven by a schema object in `src/config/schema.ts` (string, number, boolean, enum, required, default). `port: '8080'` from the environment becomes the number 8080 there; a missing required value or a wrong type is reported with every problem at once, not just the first.
    - The public entry point `getConfig()` keeps its signature and return type so the rest of the app does not change.

    Please keep the current behaviour for every existing setting (there are about thirty; the current tests in `test/config/` describe them) and add tests for each source, for the merge order, and for the validation messages. The old `loadConfig` body should be gone at the end, not left beside the new code.

