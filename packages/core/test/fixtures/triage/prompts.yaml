- task: t12
  lang: en
  split: test
  label: { kind: direct, level: L1, files: 2, dirs: 2 }
  short: |
    make fetchJson retry up to 3 times with exponential backoff on 5xx and network errors
  spec: |
    `fetchJson` in `src/net/fetchJson.ts` gives up on the first failure. I would like it to retry.

    Rules:
    1. Retry on network errors and on HTTP 500 to 599. Never retry 4xx.
    2. At most 3 attempts in total (so 2 retries).
    3. Wait 200 ms before the second attempt and 400 ms before the third.
    4. If every attempt fails, throw the last error, unchanged.
    5. An `AbortSignal` passed by the caller stops the waiting immediately and rejects with the abort reason.
    6. Callers can turn it off with `{ retries: 0 }`; the default is 2.

    Signature after the change:

    ```ts
    export interface FetchJsonOptions { retries?: number; signal?: AbortSignal }
    export function fetchJson<T>(url: string, options?: FetchJsonOptions): Promise<T>;
    ```

    Existing callers pass no options and must keep working. Tests go in `test/net/fetchJson.test.ts`; the file already has a fake server helper you can use, and please use fake timers so the tests do not actually wait.

