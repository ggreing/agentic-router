  split: dev
  label: { kind: team, level: L2, files: 6, dirs: 4 }
  short: |
    the task list endpoint needs filtering, sorting and pagination
  spec: |
    Add filtering, sorting and pagination to the task list. Today `GET /tasks` returns every task as `{ items }`. Split the work by layer: the filtering itself belongs in the repository, validation and defaults in the service, query-string parsing in the handler.

    ## Service
    Add `TaskService.queryTasks(query?: TaskQuery): TaskPage` and keep `listTasks()` returning the full array.

    ```ts
    interface TaskQuery {
      status?: TaskStatus[];        // any of these
      assigneeId?: string | null;   // null = unassigned only
      text?: string;                // case-insensitive match in title
      sort?: 'createdAt' | 'priority' | 'dueDate';
      order?: 'asc' | 'desc';
      page?: number;                // 1-based, default 1
      pageSize?: number;            // default 20, max 100
    }
    interface TaskPage { items: Task[]; total: number; page: number; pageSize: number }
    ```

    ## Repository
    - `TaskRepo.find(filter, sort, range)` returns the page and the total count before paging.
    - Sorting by `priority` uses the order low < medium < high; ties fall back to `createdAt` ascending.

    ## Handler
    - `GET /tasks?status=todo,in_progress&assignee=u1&sort=priority&order=desc&page=2&pageSize=50`
    - `assignee=none` means unassigned.
    - Unknown status values, a non-numeric page, or `pageSize` above 100 give 400 with the usual validation body.

    ## Tests
    - Repository: each filter alone, combined filters, each sort key in both orders, paging past the end.
    - Service: defaults and validation.
    - Handler: query parsing and error mapping.

