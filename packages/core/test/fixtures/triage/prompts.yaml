- task: t14
  lang: en
  split: test
  label: { kind: direct, level: L1, files: 2, dirs: 1 }
  short: |
    test/report/weekly.test.ts fails on CI but passes locally, I think it's a timezone thing. can you fix the test
  spec: |
    We have a flaky test. `weekly report groups tasks by ISO week` in `test/report/weekly.test.ts` passes on every laptop in Seoul and fails on CI, which runs in UTC.

    ```
    AssertionError [ERR_ASSERTION]: Expected values to be strictly equal:
    + actual - expected

    + '2026-W45'
    - '2026-W46'
        at TestContext.<anonymous> (test/report/weekly.test.ts:41:10)
    ```

    What I found so far:
    - The fixture builds its dates with `new Date(2026, 10, 9, 0, 30)`, which is local time.
    - In UTC that moment is still Sunday the 8th, which belongs to week 45.
    - The production code (`src/report/weekly.ts`) takes a `timeZone` argument and is, as far as I can tell, correct.

    So I think the test is wrong, not the code. Please make the fixture independent of the machine's time zone (build the dates from ISO strings with an explicit offset and pass `timeZone: 'Asia/Seoul'` to the function), and if the shared helper in `test/report/helpers.ts` builds dates the same way, fix it there too. Do not change `src/report/weekly.ts` unless you find it is actually wrong; if you do, tell me before changing it.

- task: t15
  lang: ko
  split: dev
  label: { kind: direct, level: L1, files: 2, dirs: 2 }
  short: |
    deepMerge에 배열을 이어 붙이는 옵션(arrays: 'concat') 넣어줘. 기본은 지금처럼 교체
  spec: |
    confkit `deepMerge`에 배열 병합 방식을 고르는 옵션을 추가해 주세요. 함수 하나와 그 테스트만 바뀌는 작업입니다.

    ```ts
    interface MergeOptions { arrays?: 'replace' | 'concat' | 'unique' }
    function deepMerge(layers: ConfigObject[], options?: MergeOptions): ConfigObject;
    ```

    규칙:
    1. `arrays`를 생략하면 `'replace'`이고 지금 동작과 같습니다(나중 레이어의 배열이 통째로 교체).
    2. `'concat'`이면 같은 키의 배열을 레이어 순서대로 이어 붙입니다.
    3. `'unique'`는 `'concat'`과 같되 원시값 중복을 제거하고 처음 나온 순서를 유지합니다.
    4. 객체가 든 배열에서 `'unique'`는 참조가 아니라 `JSON.stringify` 결과로 비교합니다.
    5. 한쪽이 배열이고 다른 쪽이 배열이 아니면 옵션과 무관하게 나중 값이 이깁니다.
    6. 중첩 객체 안의 배열에도 같은 규칙이 적용됩니다.
    7. 입력 레이어는 어떤 경우에도 변경하지 않습니다.
    8. 결과는 입력과 배열 참조를 공유하지 않습니다.
    9. 알 수 없는 `arrays` 값은 `ConfigError`를 던집니다.

    기존 호출부는 `deepMerge(a, b, c)`처럼 가변 인자를 쓰고 있는데, 이번에 시그니처를 위처럼 바꾸지 말고 기존 형태를 유지한 채 마지막 인자가 `MergeOptions` 모양이면 옵션으로 해석해 주세요. 구현은 `src/merge.ts`, 테스트는 `test/merge.test.ts`입니다.

- task: t16
