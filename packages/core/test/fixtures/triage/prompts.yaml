    - 수정하면 `editedAt`을 채웁니다
    - 태스크가 삭제되면 그 태스크의 댓글도 함께 지웁니다(`TaskService.deleteTask`에서 호출)

    ## 핸들러
    - `POST /tasks/:id/comments`, `GET /tasks/:id/comments`, `PATCH /comments/:id`, `DELETE /comments/:id`
    - 에러 매핑은 기존 핸들러와 같게: Validation 400, Forbidden 403, NotFound 404

    ## 테스트
    - 서비스와 핸들러 각각 정상·실패 경우, 태스크 삭제 시 연쇄 삭제

