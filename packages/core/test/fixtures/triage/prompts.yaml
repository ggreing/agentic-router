- task: t26
  lang: en
  split: test
  label: { kind: team, level: L3, files: 30, dirs: 10 }
  short: |
    move the order pipeline from synchronous REST calls between services to an event-driven architecture on a message queue
  spec: |
    Placing an order today is a chain of synchronous REST calls: checkout calls inventory, inventory calls pricing, checkout then calls payments and finally notifications. When any one of them is slow the whole request times out, and a failure in the middle leaves stock reserved for an order that does not exist.

    I want to move this pipeline to events on a message queue. We have not picked the broker; propose one and justify it.

    What has to be designed before any code:
    - The events (`order.placed`, `stock.reserved`, `stock.rejected`, `payment.captured`, `payment.failed`, `order.confirmed`, `order.cancelled`) with their payloads and versioning rule.
    - Who owns which state, and the saga that replaces the call chain, including the compensation for each step.
    - Delivery guarantees: at-least-once with idempotent consumers, an outbox table in each producer so a database commit and a publish cannot diverge, and a dead-letter path with a way to replay.
    - Ordering requirements per order id.
    - How the checkout API answers the browser now that the result arrives later.

    Then the work itself, service by service: checkout, inventory, pricing, payments and notifications each get a publisher and consumers, the outbox and its relay, and contract tests for every event they produce or consume. The old REST endpoints between services stay until the new path has run in shadow mode; plan that migration and the cut-over, and tell me what we can roll back at each stage.

    Observability is part of this: a correlation id on every event, and a way to see where a given order is stuck.

