  short: |
    add a --dry-run flag to the `sync` command that prints what it would upload without uploading
  spec: |
    Feature request for the CLI: `mytool sync --dry-run`.

    Today `sync` walks the local folder, compares each file with the remote listing and uploads the ones that changed. I want a way to see what it would do first.

    Behaviour:
    - `--dry-run` (boolean, default false) is accepted by the `sync` command only.
