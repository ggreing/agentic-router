  prompt: |
    confkit の構造を変えてください。今は `loadConfig` がレイヤーを 1 度まとめて普通のオブジェクトを返して終わりなので、(1) 値がどのレイヤーから来たのか分からず、(2) JSON やコマンドライン引数のような新しい入力をつなぐ場所がなく、(3) 値どうしで参照できず、(4) 実行中に読み直すことができません。入力を **ソース** として抽象化し、その上に **出所の追跡 · 参照の置換 · 参照用の Config オブジェクト · 読み直し** を載せようとしています。`loadConfig` は、新しい構造の上で動く薄いラッパーとして残します。モジュールは役割ごとに分けてください(ソース群、マージ・出所、置換、比較、マスク、Config オブジェクト)。

    下の名前はすべて `src/index.ts` から export します。エラーはすべて既存の `ConfigError` を使います。

    ## 1. ソース
    ```ts
    interface ConfigSource { name: string; load(): ConfigObject }

    objectSource(name: string, value: ConfigObject | (() => ConfigObject)): ConfigSource
    iniSource(name: string, text: string | (() => string)): ConfigSource      // 既存の parseIni
    jsonSource(name: string, text: string | (() => string)): ConfigSource
    envSource(env: Record<string, string | undefined>, prefix = 'APP_', name = 'env'): ConfigSource   // 既存の fromEnv
    argvSource(argv: string[], name = 'argv'): ConfigSource
    ```
    - ソースを作るときには何も読まず、`load()` を呼ぶたびに新しく読みます。関数を渡した場合は `load()` のたびにその関数を呼び直し、`envSource` は渡された env オブジェクトを毎回見直します。
    - `objectSource` の `load()` はディープコピーを返します(受け取った側が書き換えても元はそのまま)。
    - `jsonSource`: 最上位がオブジェクトの JSON だけを受け付けます。パースの失敗や、最上位がオブジェクトでない場合(配列、数値、null)は `load()` で `ConfigError` になり、メッセージにソース名が入ります。JSON の `null` の値はそのまま残します。
    - `argvSource` のルール:
      - `--db.host=localhost`: `=` の後ろが値です(`--name=` は空文字列、値の中の `=` はそのまま)。
      - `--port 8080`: `=` がなく、次のトークンが `--` で始まらなければ、そのトークンが値です(`--offset -5` は -5)。
      - `--debug`: 値がなければ `true`。
      - `--no-debug`: `false`。次のトークンを値として取りません。
      - キーの `.` はネストです。値は INI の値と同じルールで変換します(`true`/`false`、数値、引用符で囲めば文字列)。
      - `--` が現れたら、その後ろはすべて無視します。オプションでもオプションの値でもないトークンは無視します。

    ## 2. マージと出所
    ```ts
    resolveSources(sources: ConfigSource[]): { value: ConfigObject; origins: Record<string, string> }
    ```
    - 順番に `load()` してまとめます。後ろのソースが勝ち、オブジェクトどうしはキー単位でまとめ、それ以外の値(配列を含む)は丸ごと置き換わります(既存の `deepMerge` と同じルール)。
    - `origins` は、結果の **葉**(オブジェクトでない値。配列と null も葉)のパスごとに、その値を与えたソースの名前です。パスは `'db.host'` のようなドット区切りです。オブジェクトがスカラーに、またはスカラーがオブジェクトに変わったら、以前のパスの出所は消えなければなりません。
    - ソース名が重複していたら `ConfigError`(メッセージにその名前を含む)。

    ## 3. 参照の置換
    ```ts
    interpolate(config: ConfigObject): ConfigObject   // 新しいオブジェクトを返し、入力は変えない
    ```
    - 文字列の値の中の `${パス}` を、そのパスの値に置き換えます。配列の中の文字列も対象です。波かっこの中の前後の空白は無視します。
    - 文字列全体が参照 1 つだけなら(`'${port}'`)、参照先の値の型を保ちます(数値は数値のまま)。ほかの文字と混ざっていれば、文字列として連結します。
    - 参照先の値にさらに参照があれば、最後まで展開します。
    - `$${` は置換せず、文字どおりの `${` になります。
    - エラー(`ConfigError`、`path` はその参照が入っている値のパス):
      - 存在しないパス: メッセージに `unknown reference` を含む
      - 循環(自分自身を含む): メッセージに `circular reference` を含む
      - 参照先の値が文字列・数値・真偽値でない(オブジェクト、配列、null)

    ## 4. 比較
    ```ts
    interface ConfigChange { path: string; before: ConfigValue | undefined; after: ConfigValue | undefined }
    diffConfig(before: ConfigObject, after: ConfigObject): ConfigChange[]
    ```
    葉の単位で、追加(`before: undefined`) · 削除(`after: undefined`) · 変更を、path の昇順で返します。配列は中身が同じなら同じ値です。葉がオブジェクトに変わった場合は、以前の葉の削除と新しい葉の追加として現れます。

    ## 5. Config オブジェクト
    ```ts
    createConfig(options: {
      sources: ConfigSource[];
      interpolate?: boolean;   // 既定 true
      secrets?: string[];      // マスクするパスのパターン
    }): Config

    interface Config {
      get(path: string): ConfigValue | undefined;
      has(path: string): boolean;
      require(path: string): ConfigValue;
      getString(path: string, fallback?: string): string;
      getNumber(path: string, fallback?: number): number;
      getBoolean(path: string, fallback?: boolean): boolean;
      getDuration(path: string, fallback?: number): number;   // ms
      origin(path: string): string | undefined;
      explain(): Array<{ path: string; value: ConfigValue; source: string }>;
      toObject(options?: { redact?: boolean }): ConfigObject;
      reload(): ConfigChange[];
      onChange(listener: (changes: ConfigChange[]) => void): () => void;
    }
    ```
    - `createConfig` はすぐに読みます(ソースのエラー・置換のエラーがあれば、ここで throw)。値はマージの後、置換まで済んだ値で、出所はマージの時点が基準です。
    - `require` と型付きの取得で値がなければ `ConfigError`(メッセージに `missing required config` を含み、`path` を設定)。型付きの取得は、`fallback` を渡すと、値が **ないときだけ** それを返します。
    - 型が合わなければ `ConfigError`(`path` を設定し、メッセージに下の文言を含む):
      - `getString`: 文字列だけ。`expected string`
      - `getNumber`: 数値または数字の文字列(`'3'`)。`expected number`
      - `getBoolean`: 真偽値または `'true'`/`'false'`。`expected boolean`
      - `getDuration`: 数値(ms)または既存の `parseDuration` が読める文字列。`expected duration`
    - `origin(path)`: 葉のパスのソース名。オブジェクトのパスや存在しないパスは `undefined`。
    - `explain()`: すべての葉を path の昇順で。`toObject()`: ディープコピー。
    - `secrets`: ドット区切りのパスのパターンで、`*` はセグメント 1 つに対応します(`db.password`、`*.token`、`api.*`)。パターンに合うパスとその下位は秘密です。`toObject({ redact: true })` は秘密の値を `'***'` に置き換え(秘密のパスがオブジェクトなら、オブジェクト全体が `'***'`)、`explain()` は秘密の葉の `value` を `'***'` で出します。`get` などの直接の取得は実際の値を返します。
    - `reload()`: すべてのソースを読み直して入れ替え、以前の値との `diffConfig` の結果を返します。変更が 1 つでもあれば、登録されたリスナーをその配列で 1 回ずつ呼びます。変更がなければ呼びません。読み直しの途中でエラーが出たら throw し、**以前の状態をそのまま保ち**、リスナーも呼びません。
    - `onChange` は解除用の関数を返します。

