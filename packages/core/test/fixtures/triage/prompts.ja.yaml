- task: t26
  lang: ja
  from: en
  split: test
  label: { kind: team, level: L3, files: 30, dirs: 10 }
  short: |
    注文パイプラインを、サービス間の同期 REST 呼び出しから、メッセージキューを使ったイベント駆動アーキテクチャに移して
  spec: |
    現在、注文の確定は同期 REST 呼び出しの連鎖です。checkout が inventory を呼び、inventory が pricing を呼び、その後 checkout が payments を、最後に notifications を呼びます。どれか 1 つが遅いとリクエスト全体がタイムアウトし、途中で失敗すると、存在しない注文のために在庫が引き当てられたまま残ります。

    このパイプラインを、メッセージキュー上のイベントに移したいです。ブローカーはまだ選んでいません。1 つ提案して、その理由を示してください。

    コードを書く前に設計しておくべきこと:
    - イベント(`order.placed`、`stock.reserved`、`stock.rejected`、`payment.captured`、`payment.failed`、`order.confirmed`、`order.cancelled`)と、そのペイロード、バージョン付けの規則。
    - どの状態を誰が所有するか。呼び出しの連鎖に代わるサーガと、各ステップの補償処理。
    - 配信保証: 冪等なコンシューマーを前提とした at-least-once、データベースのコミットと発行が食い違わないよう各プロデューサーに置く outbox テーブル、再送の手段を備えたデッドレターの経路。
    - 注文 ID ごとの順序の要件。
    - 結果が後から届くようになった今、checkout の API がブラウザーにどう応答するか。

    そのうえで、作業そのものをサービスごとに進めます。checkout、inventory、pricing、payments、notifications のそれぞれに、パブリッシャーとコンシューマー、outbox とそのリレー、そして発行または購読するすべてのイベントの契約テストを用意します。サービス間の古い REST エンドポイントは、新しい経路がシャドーモードで動くまで残します。その移行と切り替えを計画し、各段階で何をロールバックできるかを教えてください。

    可観測性もこの作業の一部です。すべてのイベントに相関 ID を付け、特定の注文がどこで止まっているかを確認できる手段を用意します。

- task: t27
  lang: ja
  from: ko
  split: dev
  label: { kind: team, level: L3, files: 40, dirs: 12 }
  short: |
    サービスにマルチテナンシーを導入して。顧客企業ごとにデータが完全に分離されている必要がある
  spec: |
    現在のサービスは、顧客企業が 1 社であることを前提に作られています。2 社目の契約が決まったので、1 つのデプロイで複数の顧客企業を受け入れられるように変える必要があります。顧客企業の間でデータが混ざることは、絶対にあってはなりません。

    まず分離の方式を決める必要があります。テーブルごとに `tenant_id` を持たせる方式、スキーマを分ける方式、データベースを分ける方式のうち、私たちの規模(顧客企業は数十社、テーブルは 40 余り)に合うものを比較して提案してください。私は `tenant_id` 列と行レベルセキュリティポリシーの組み合わせを考えていますが、確信はありません。

    方式が決まれば、変わる範囲は次のとおりです。認証トークンにテナントが入り、リクエストごとにテナントコンテキストが設定され、リポジトリ層のすべてのクエリに自動で適用される必要があります。個々のクエリで条件を書き忘れても、ほかの顧客企業のデータが見えないようにすることが要点です。すべてのテーブルにマイグレーションが必要で、既存のデータは 1 社目の顧客企業のものとして埋めます。一意制約(メールアドレス、プロジェクトキーなど)はテナントの範囲に変わります。キャッシュキー、バックグラウンドジョブ、ファイルの保存パス、検索インデックス、監査ログにもテナントを入れる必要があります。管理者向けに、テナントを作成・停止する API も必要です。

    テストは、層ごとに「ほかのテナントのデータにアクセスすると、存在しないものとして見える」ことを確認するものを基本として敷いてください。

- task: t28
  lang: ja
  from: en
  split: test
  label: { kind: team, level: L3, files: 22, dirs: 7 }
  short: |
    サードパーティが CLI にコマンドやエクスポーターを追加できるよう、プラグインシステムを設計して作って
  spec: |
    CLI にエクスポーターやサブコマンドをもう 1 つ足す、というプルリクエストが次々に届きますが、そのすべてを私たちが抱えたくはありません。それらを各自で配布できるよう、プラグインシステムが欲しいです。

    ## プラグインにできること
    - コマンドの登録(名前、オプション、ハンドラー)。
    - `export` コマンド用のエクスポーターの登録(形式名、ファイル拡張子、私たちのデータモデルからバイト列への関数)。
    - `beforeSync` と `afterSync` へのフック。

    ## 設計が必要なこと
    1. 拡張 API とその安定性の約束: バージョン付きの `PluginApi` オブジェクト、何が公開か、どう非推奨にするか。
    2. 発見と読み込み: プラグインは `mytool-plugin-*` という名前の npm パッケージで、設定ファイルに列挙する。読み込み順。2 つのプラグインが同じ名前を登録したときにどうなるか。
    3. 分離: 読み込み中やフックの中で例外を投げたプラグインが CLI を落としてはならない。どこまでやるか(try/catch、ワーカースレッド、権限)を決める。
    4. 設定: 各プラグインは、設定ファイルの中に検証済みの専用セクションを持つ。
    5. 開発者体験: テンプレート、型定義、`mytool plugin doctor` コマンド。

    ## 移行
    - 組み込みのエクスポーター 3 つ(csv, json, markdown)と `stats` コマンドを同じ API に載せ替え、本体が他者に提供する仕組みを自分でも使うようにする。
    - プラグインを入れていない人にとっては、動作は変わらない。

    ## 成果物
    - まずレビュー用の設計文書。
    - ローダー、型定義付きの API パッケージ、移行した組み込み機能、読み込み・衝突・失敗するプラグインのテスト、それにプラグインの実例を 1 つ含むドキュメント。

- task: t29
