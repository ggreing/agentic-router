# Triage evaluation prompts in Japanese (decision 139): the 30 tasks of prompts.yaml, both wordings.
#
# A translation of prompts.yaml, task by task: same task ids, labels and splits; `from` is the language of
# the original. Code, identifiers, paths and log lines are kept as they are. Written by hand as a developer
# would type them, not tuned to the stage-1 keywords. Used to compare stage 1 across languages; the limits
# stated in prompts.yaml apply here too.

- task: t01
  lang: ja
  from: ko
  split: dev
  label: { kind: direct, level: L0, files: 1, dirs: 1 }
  short: |
    interpolate のエラーメッセージに vlaue という誤字がある。直して
  spec: |
    textkit の `interpolate` で、値のない placeholder に出会ったときに投げるエラーメッセージに誤字があります。

    ## 再現手順
    1. `interpolate('Hi {{name}}', {})` を呼ぶ
    2. `TextkitError` が投げられる
    3. `message` を出力する

    ## 実際
    `Missing vlaue for placeholder "name"`

    ## 期待
    `Missing value for placeholder "name"`

    ユーザーの画面にそのまま表示される文言なので、リリース前に直す必要があります。メッセージ文字列だけ変えれば十分で、`strict: false` のときに placeholder をそのまま残す動作や、エラークラス、エラーコードには触れないでください。同じ誤字がほかのファイルにないことは確認済みです。

