    ハンドラーは 8 個ほどあり(`src/handlers/` の下)、各ハンドラーのテストも認証ヘッダーを付けるように直す必要があります。トークンの検証は `src/auth/` の下に新しいモジュールとして置き、署名鍵は設定から読みます。ロールと許可される操作の対応表は 1 か所(`src/auth/policy.ts`)にまとめ、ハンドラーごとに条件分岐が散らばらないようにしてください。既存のサービス層はユーザー情報を引数に取りませんが、作成者の記録が必要な `createTask` と `addComment` だけ `actorId` を受け取るように変えます。

