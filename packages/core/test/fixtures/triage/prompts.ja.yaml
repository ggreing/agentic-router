  spec: |
    ユーザーに見えるエラーメッセージが、コードのあちこちに韓国語の文字列として埋め込まれています。英語のユーザーを受け入れる必要があるので、メッセージをキーに置き換え、言語ごとのカタログから取り出して使う形に変えようとしています。

