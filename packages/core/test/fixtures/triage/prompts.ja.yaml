- task: t20
  lang: ja
  from: ko
  split: test
  label: { kind: team, level: L2, files: 7, dirs: 5 }
  short: |
    誰がいつタスクを変えたのか分かるように、変更履歴を残して
  spec: |
    taskboard にタスクの変更履歴を追加してください。誰がいつ何を変えたのかを、タスクごとに参照できる必要があります。

    ## イベントモデル
    ```ts
    type AuditEventType = 'task.created' | 'task.assigned' | 'task.status_changed' | 'task.deleted';
    interface AuditEvent {
      id: string;
      taskId: string;
      type: AuditEventType;
      actorId: string | null;
      at: string;                       // ISO 8601
      before: Record<string, unknown> | null;
      after: Record<string, unknown> | null;
    }
    ```

    ## 記録するタイミング
    1. `createTask`: `task.created`、`after` に作成されたタスク
    2. `assignTask`: `task.assigned`、`before`/`after` には `assigneeId` だけ
    3. `changeStatus`: 実際に状態が変わった場合だけ `task.status_changed`
    4. `deleteTask`: `task.deleted`、`before` に削除前のタスク
    5. 失敗したリクエスト(検証失敗、409)は記録しません

    ## 保存と参照
    - `AuditRepo.append(event)`、`AuditRepo.listByTask(taskId)`(時刻順)
    - `GET /tasks/:id/audit` は `{ items }` で応答、存在しないタスクは 404
    - 削除されたタスクの履歴は残っている必要があり、参照もできます

    ## そのほか
    - `actorId` はハンドラーがリクエストコンテキストから取り出してサービスに渡します
    - サービスのメソッドのシグネチャに、`actorId` を最後の任意引数として追加
    - サービス・ハンドラーのテストを追加

- task: t21
  lang: ja
  from: en
  split: dev
  label: { kind: team, level: L2, files: 9, dirs: 3 }
  short: |
    データアクセス層をコールバックから async/await に変換して
  spec: |
    データアクセス層はいまだに Node 形式のコールバックを使っていますが、その上はすべて Promise を使っています。そのため各サービスが、リポジトリの呼び出しを手作業で `new Promise(...)` に包んでいます。リポジトリが直接 Promise を返すようにしたいです。

    `src/repo/` の下にリポジトリのファイルが 5 つ(users, tasks, comments, tags, sessions)あり、それに加えて、そのすべてが呼んでいる共有ヘルパー `src/repo/db.ts` があります。エクスポートされている各関数は現在 `(args..., cb)` を受け取ります。変更後は `(args...)` を受け取り、コールバックがこれまで受け取っていたのと同じエラーオブジェクトで reject する Promise を返します。`db.ts` のヘルパーは `query` と `transaction` を Promise を返す関数として公開し、`transaction` は、実行する関数が reject したらロールバックしなければなりません。

    次に呼び出し側です。`src/service/` の下の 3 つのサービスは、手書きのラッパーをやめて、リポジトリの呼び出しを単に `await` するようにします。トランザクション内のクエリの順序や、どのエラーが表に出るかを含め、動作は変えてはいけません。

    リポジトリのテストはコールバック形式の偽の `db` を使っているので、その偽物も同じ変換が必要です。リポジトリを 1 つ変換するたびにテストスイートが通る状態を保てるやり方で進めてください。そうすれば、変更をファイルごとにレビューできます。

