  label: { kind: direct, level: L1, files: 2, dirs: 2 }
  short: |
    `sync` コマンドに --dry-run フラグを追加して。アップロードはせず、アップロードする予定のものを表示する
  spec: |
    CLI への機能要望です: `mytool sync --dry-run`。

    現在の `sync` はローカルフォルダーをたどり、各ファイルをリモートの一覧と比べて、変更のあったものをアップロードします。実行前に何が起きるかを確認できるようにしたいです。

    動作:
    - `--dry-run`(真偽値、既定は false)は `sync` コマンドだけが受け付ける。
    - このフラグを付けると、アップロード呼び出しの手前までは通常どおり処理し、アップロードする予定のファイルごとに `would upload <relative path> (<size> bytes)` の形式で 1 行ずつ出力して、最後に `N file(s) would be uploaded` を出力する。
    - ネットワークへの書き込みは行わない。リモートの一覧を読むのは構わない。
    - 一覧の取得に成功したら、今と同じく終了コードは 0。
    - `--help` にこのフラグが 1 行の説明付きで表示される。

    コマンドは `src/commands/sync.ts` にあり、アップロード自体は末尾近くの `uploader.put()` の呼び出し 1 か所です。`test/commands/sync.test.ts` の既存テストの隣に、フラグを指定したときに何もアップロードされないことを確かめるテストを足してください。

