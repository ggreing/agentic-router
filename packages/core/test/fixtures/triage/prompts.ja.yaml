    - `Cache.has(key)` も同じ基準です。
    - 負の値や数値でない値は、設定を読むときに既存の検証エラーと同じやり方で拒否します。

    手を入れるのは `src/cache/cache.ts`、設定スキーマのある `src/config/schema.ts`、それと `test/cache/cache.test.ts` くらいです。時刻は `Date.now()` ではなく、コンストラクターに注入する `now()` 関数を使って、テストで時計を進められるようにしてください(`Clock` 型はすでに `src/util/clock.ts` にあります)。

- task: t14
  lang: ja
  from: en
  split: test
  label: { kind: direct, level: L1, files: 2, dirs: 1 }
  short: |
    test/report/weekly.test.ts が CI では失敗するのにローカルでは通る。タイムゾーンのせいだと思う。テストを直してもらえる？
  spec: |
    不安定なテストがあります。`test/report/weekly.test.ts` の `weekly report groups tasks by ISO week` は、ソウルにあるどのノート PC でも通りますが、UTC で動いている CI では失敗します。

    ```
    AssertionError [ERR_ASSERTION]: Expected values to be strictly equal:
    + actual - expected

    + '2026-W45'
    - '2026-W46'
        at TestContext.<anonymous> (test/report/weekly.test.ts:41:10)
    ```

    これまでに分かったこと:
    - フィクスチャは日付を `new Date(2026, 10, 9, 0, 30)` で作っており、これはローカル時刻です。
    - UTC ではその時点はまだ 8 日の日曜日で、第 45 週に属します。
    - 本番コード(`src/report/weekly.ts`)は `timeZone` 引数を受け取っており、私の見るかぎり正しいです。

    したがって、間違っているのはコードではなくテストだと考えています。フィクスチャをマシンのタイムゾーンに依存しないようにしてください(オフセットを明示した ISO 文字列から日付を作り、関数に `timeZone: 'Asia/Seoul'` を渡す)。`test/report/helpers.ts` の共有ヘルパーも同じやり方で日付を作っているなら、そちらも直してください。`src/report/weekly.ts` は、実際に誤りだと分かった場合を除いて変えないでください。誤りを見つけたら、変える前に知らせてください。

- task: t15
  lang: ja
  from: ko
  split: dev
  label: { kind: direct, level: L1, files: 2, dirs: 2 }
  short: |
    deepMerge に配列を連結するオプション(arrays: 'concat')を入れて。既定は今までどおり置き換え
  spec: |
    confkit の `deepMerge` に、配列のマージ方法を選ぶオプションを追加してください。関数 1 つとそのテストだけが変わる作業です。

    ```ts
    interface MergeOptions { arrays?: 'replace' | 'concat' | 'unique' }
    function deepMerge(layers: ConfigObject[], options?: MergeOptions): ConfigObject;
    ```

    ルール:
    1. `arrays` を省略すると `'replace'` で、現在の動作と同じです(後のレイヤーの配列で丸ごと置き換え)。
    2. `'concat'` なら、同じキーの配列をレイヤーの順に連結します。
    3. `'unique'` は `'concat'` と同じですが、プリミティブ値の重複を取り除き、最初に現れた順序を保ちます。
    4. オブジェクトを含む配列での `'unique'` は、参照ではなく `JSON.stringify` の結果で比較します。
    5. 片方が配列で、もう片方が配列でない場合は、オプションに関係なく後の値が勝ちます。
    6. ネストしたオブジェクトの中の配列にも同じルールが適用されます。
    7. 入力のレイヤーは、どんな場合でも変更しません。
    8. 結果は入力と配列の参照を共有しません。
    9. 未知の `arrays` の値には `ConfigError` を投げます。

    既存の呼び出し側は `deepMerge(a, b, c)` のように可変長引数を使っています。今回はシグネチャを上のように変えるのではなく、既存の形を保ったまま、最後の引数が `MergeOptions` の形ならオプションとして解釈するようにしてください。実装は `src/merge.ts`、テストは `test/merge.test.ts` です。

- task: t16
  lang: ja
  from: ko
  split: test
  label: { kind: team, level: L2, files: 7, dirs: 5 }
  short: |
    タスクにコメント機能を入れて
  spec: |
    taskboard にタスクへのコメント機能を追加してください。リポジトリ、サービス、ハンドラーの各層に、それぞれに合うように分けて実装します。

    ## モデル
    ```ts
    interface Comment {
      id: string;
      taskId: string;
      authorId: string;
      body: string;        // 1〜2000 文字、前後の空白を除いた長さ
      createdAt: string;   // ISO 8601
      editedAt: string | null;
    }
    ```

    ## リポジトリ (`CommentRepo`)
    - `add(comment)`, `listByTask(taskId)`, `get(id)`, `update(id, patch)`, `remove(id)`
    - `listByTask` は `createdAt` の昇順

    ## サービス (`CommentService`)
    - 存在しないタスクにコメントすると `NotFoundError`
    - `body` の検証失敗は `ValidationError`(details に `'body'`)
    - 編集・削除できるのは投稿者だけで、そうでなければ `ForbiddenError`
    - 編集したら `editedAt` を埋めます
    - タスクが削除されたら、そのタスクのコメントも一緒に消します(`TaskService.deleteTask` から呼ぶ)

    ## ハンドラー
    - `POST /tasks/:id/comments`, `GET /tasks/:id/comments`, `PATCH /comments/:id`, `DELETE /comments/:id`
    - エラーの対応付けは既存のハンドラーと同じ: Validation 400、Forbidden 403、NotFound 404

    ## テスト
    - サービスとハンドラーそれぞれの正常系・異常系、タスク削除時の連鎖削除

- task: t17
  lang: ja
  from: en
  split: dev
  label: { kind: team, level: L2, files: 6, dirs: 4 }
  short: |
    タスク一覧のエンドポイントに、フィルタリング、ソート、ページネーションが必要
  spec: |
    タスク一覧にフィルタリング、ソート、ページネーションを追加してください。現在の `GET /tasks` はすべてのタスクを `{ items }` で返します。作業は層ごとに分けます。フィルタリングそのものはリポジトリに、検証と既定値はサービスに、クエリ文字列の解析はハンドラーに置きます。

    ## サービス
    `TaskService.queryTasks(query?: TaskQuery): TaskPage` を追加し、`listTasks()` は全件の配列を返すままにします。

    ```ts
    interface TaskQuery {
      status?: TaskStatus[];        // any of these
      assigneeId?: string | null;   // null = unassigned only
      text?: string;                // case-insensitive match in title
      sort?: 'createdAt' | 'priority' | 'dueDate';
      order?: 'asc' | 'desc';
      page?: number;                // 1-based, default 1
      pageSize?: number;            // default 20, max 100
    }
    interface TaskPage { items: Task[]; total: number; page: number; pageSize: number }
    ```

    ## リポジトリ
    - `TaskRepo.find(filter, sort, range)` は、該当ページと、ページ分割前の総件数を返す。
    - `priority` でのソートは low < medium < high の順を使い、同順位は `createdAt` の昇順で決める。

    ## ハンドラー
    - `GET /tasks?status=todo,in_progress&assignee=u1&sort=priority&order=desc&page=2&pageSize=50`
    - `assignee=none` は担当者なしを意味する。
    - 未知の status の値、数値でない page、100 を超える `pageSize` は、通常の検証エラー本文付きで 400。

    ## テスト
    - リポジトリ: 各フィルター単独、フィルターの組み合わせ、各ソートキーの両方向、末尾を越えたページ。
    - サービス: 既定値と検証。
    - ハンドラー: クエリの解析とエラーの対応付け。

- task: t18
