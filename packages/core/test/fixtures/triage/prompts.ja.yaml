    変える必要があるのは、エラーを投げているサービスすべて(タスク、ユーザー、コメント、プロジェクト)と検証ユーティリティ、そしてハンドラーのエラーの対応付けです。メッセージ文字列を直接比較しているテストがかなりありますが、これらは `code` を比較するように直し、文章そのものはカタログのテストで 1 回だけ確認します。カタログにないキーを使ったらテストで引っかかるように、2 つのカタログのキー集合が同じであること、コードで使っているキーがすべて入っていることを確認するテストも入れてください。

- task: t23
  lang: ja
  from: en
  split: dev
  label: { kind: team, level: L2, files: 8, dirs: 5 }
  short: |
    タスクの削除は、復元できるようにソフトデリートにするべき
  spec: |
    現在はタスクを本当に削除していて、サポートから「戻してほしい」という依頼が何度も来ます。削除をソフトデリートにしてください。

    ## モデル
    - `Task` に `deletedAt: string | null`(ISO 8601)を持たせる。null でなければ、そのタスクは削除済み。

    ## リポジトリ
    - `remove(id)` は行を消す代わりに `deletedAt` を設定する。
    - `get`、`list`、`find` は、`{ includeDeleted: true }` 付きで呼ばれないかぎり、削除済みのタスクを飛ばす。
    - 新しい `restore(id)` は `deletedAt` を消す。
    - 新しい `purge(olderThan: Date)` は、その日付より前に削除されたタスクを本当に取り除く。

    ## サービス
    - `deleteTask` は、呼び出し側から見た動作を保つ: タスクは見えなくなり、2 度目の削除は 404。
    - `restoreTask(id)` は、一度も削除されていない、または存在しないタスクに対して `NotFoundError` で失敗する。
    - 削除済みタスクのコメントと監査イベントは残り、タスクと一緒に戻ってくる。
    - 件数と週次レポートは削除済みのタスクを無視する。

    ## HTTP
    - `DELETE /tasks/:id` はクライアントから見て変わらない。
    - 管理者向けの `POST /tasks/:id/restore`。
    - 管理者向けの `GET /tasks?deleted=only` はごみ箱の一覧を返す。

    ## マイグレーションと後片付け
    - マイグレーションでこの列を追加し、既存の行はすべて null にする。
    - 日次ジョブが、現在から 30 日前を指定して `purge` を呼ぶ。

    ## テスト
    - リポジトリ、サービス、ハンドラーの各レベル、それに、すでにタスクが入っているデータベースでのマイグレーション。

- task: t24
  lang: ja
  from: ko
  split: test
  label: { kind: team, level: L2, files: 9, dirs: 5 }
  short: |
    ユーザーごとの通知設定機能を追加(メール/Slack のチャネル、イベントごとの on/off)
  spec: |
    ユーザーごとに、通知を受け取るチャネルとイベントを選べるようにしてください。

    ## 設定モデル
    ```ts
    type Channel = 'email' | 'slack';
    type NotifyEvent = 'task.assigned' | 'task.due_soon' | 'comment.added';
    interface NotificationSettings {
      userId: string;
      channels: Record<Channel, { enabled: boolean; address: string | null }>;
      events: Record<NotifyEvent, Channel[]>;
    }
    ```

    ## 要件
    1. 設定のないユーザーは既定値(メールだけ有効、すべてのイベントをメールで)として扱います。
    2. `GET /me/notifications`、`PUT /me/notifications` で取得・保存します。
    3. 有効なチャネルには宛先が必要で、メールアドレスと Slack の Webhook URL の形式を検証します。
    4. イベントに指定したチャネルが無効になっていたら、保存時に 400 です。
    5. 通知を送る側(`NotificationService.notify(event, userId, payload)`)は、設定を読んで該当するチャネルにだけ送ります。
    6. チャネルごとの送信部品は `EmailSender`、`SlackSender` に分け、同じインターフェースを実装します。
    7. 1 つのチャネルの送信に失敗しても、ほかのチャネルには送り、失敗はログに残します。
    8. これまで `task.assigned` でメールを直接送っていたコードは、`notify` の呼び出しに置き換えます。
    9. `task.due_soon` は、毎時動くジョブが締め切り 24 時間以内のタスクを探して呼びます。

    ## テスト
    - 設定の検証、既定値、チャネルの選択、1 つのチャネルが失敗したときの動作

