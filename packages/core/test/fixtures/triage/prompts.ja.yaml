  label: { kind: team, level: L3, files: 60, dirs: 15 }
  short: |
    今のモノリシックな構造を、モジュールの境界がはっきりするように全面的に再設計したい。パッケージの分割まで
  spec: |
    コードベースは `src/` 1 つに 300 を超えるファイルが絡み合っていて、互いを好き勝手な向きに import しています。機能を 1 つ直すと、関係のないテストが壊れることがよくあります。構造を組み直そうとしています。

    ## 目標
    - ドメインごとのモジュール(アカウント、プロジェクト、タスク、通知、決済、レポート)に境界を分け、モジュールどうしは公開の入口(`index.ts`)だけを通して使います。
    - 依存の向きを一方向に決めます。ドメイン → 共通ユーティリティはよいが逆は不可、ドメインどうしは決められた向きだけを許します。
    - 循環依存をなくします(現在 40 個以上)。
    - ストレージへのアクセスと HTTP は各モジュールの中の外側の層に押し出し、ドメインロジックはそれらを知りません。
    - ワークスペースのパッケージに分けられるものは分けます。

    ## まず必要なもの
    1. 現在の依存グラフの分析と、モジュール境界の提案
    2. 段階的な移行計画: 一度に全部は移さず、各段階が終わるたびにビルドとテストが通ること
    3. 境界を強制する方法(lint ルールや依存関係の検査)と CI への組み込み
    4. 共通として残すものと、モジュールに下ろすものの基準

    ## 制約
    - 外部 API とデータベーススキーマは変えません
    - 移行中も機能開発は続くので、大きなブランチ 1 つではなく、小さな変更をいくつも重ねて進めます

- task: t30
  lang: ja
  from: en
  split: test
  label: { kind: team, level: L3, files: 35, dirs: 9 }
  short: |
    モバイルクライアントがオフラインで動いて、オンラインに戻ったら同期するようにする必要がある
  spec: |
    現場の技術者は、電波の届かない地下や屋上で私たちのモバイルアプリを使いますが、今のアプリはそこでは役に立ちません。どの画面も API から読み込み、どの編集もリクエストになるからです。アプリが完全にオフラインで動き、接続が戻ったら同期するようにしたいです。

    これはクライアントのデータ層の書き直しで、まず設計が必要です。私に見えている論点は次のとおりです。UI にとっての正となる、端末上のローカルストア(どのデータベースか、どんなスキーマか、アプリのバージョン間でどう移行するか)。端末で生成する安定した ID を持つ、ローカル変更のキュー。それらの変更を送り、ほかの人の変更を取得する、サーバーとの同期プロトコル(接続が切れても再開でき、頻繁に動かせるほど軽いこと)。そして競合の扱いです。競合については、レコード全体に対する「最後の書き込みが勝つ」は望みません。同じ作業指示の別々のフィールドを編集した 2 人の技術者は、どちらも自分の変更を保てるべきで、1 つのフィールドでの本当の競合はユーザーに見せるべきです。写真と署名はサイズが大きいので、リトライ付きの専用のアップロード経路が必要です。

    サーバー側にも対応する作業が必要です。ユーザーごとの変更フィード、まとめて送られてきた変更の冪等な受け付け、そして 2 週間オフラインだった端末が削除済みのレコードを復活させないための、削除のトゥームストーンです。

    アプリのすべての画面を、「取得してから描画」から、ローカルストアを読んでそれを監視する形に移す必要があり、UI には同期の状態と未送信の変更を表示する必要があります。コードを書く前に、ストア、プロトコル、競合のルール、それに既存のインストールの移行計画を扱う設計文書から始めてください。
