- task: t03
  lang: ja
  from: ko
  split: dev
  label: { kind: direct, level: L0, files: 0, dirs: 0 }
  short: |
    この正規表現は何にマッチするの？ `^(?:[\w.-]+\/)+[\w.-]+\.\w{1,5}$`
  spec: |
    コードレビュー中に下の正規表現を見かけたのですが、正確に何にマッチするのか説明していただけますか？

    ```ts
    const FILE_REF = /^(?:[\w.-]+\/)+[\w.-]+\.\w{1,5}$/;
    ```

    私の理解は次のとおりです。
    - スラッシュで区切られたパスの要素が 1 つ以上あり
    - 最後の要素に拡張子が付いていなければならない

    知りたい点:
    1. `src/a.ts` は通るのに `a.ts` はなぜ通らないのですか？
    2. 拡張子が `{1,5}` に制限されている理由はありますか？ `.jsonl` は通りますか？
    3. Windows のパス(`src\a.ts`)にはマッチしますか？
    4. `[\w.-]` の中で `.` をエスケープしなくてよいのはなぜですか？

    コードを変える必要はなく、説明だけお願いします。

