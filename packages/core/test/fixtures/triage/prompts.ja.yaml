- task: t12
  lang: ja
  from: en
  split: test
  label: { kind: direct, level: L1, files: 2, dirs: 2 }
  short: |
    fetchJson を、5xx とネットワークエラーのときに指数バックオフで最大 3 回までリトライするようにして
  spec: |
    `src/net/fetchJson.ts` の `fetchJson` は、最初の失敗で諦めてしまいます。リトライするようにしたいです。

    ルール:
    1. ネットワークエラーと HTTP 500〜599 のときにリトライする。4xx では決してリトライしない。
    2. 試行は合計で最大 3 回(つまりリトライは 2 回)。
    3. 2 回目の試行の前に 200 ms、3 回目の前に 400 ms 待つ。
    4. すべての試行が失敗したら、最後のエラーをそのまま投げる。
    5. 呼び出し側が渡した `AbortSignal` は待機をただちに止め、中断理由で reject する。
    6. 呼び出し側は `{ retries: 0 }` で無効にできる。既定は 2。

    変更後のシグネチャ:

    ```ts
    export interface FetchJsonOptions { retries?: number; signal?: AbortSignal }
    export function fetchJson<T>(url: string, options?: FetchJsonOptions): Promise<T>;
    ```

    既存の呼び出し側はオプションを渡しておらず、そのまま動き続ける必要があります。テストは `test/net/fetchJson.test.ts` に置いてください。このファイルには使える偽サーバーのヘルパーがすでにあります。テストが実際に待たないよう、フェイクタイマーを使ってください。

